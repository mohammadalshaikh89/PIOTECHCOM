<title>AML 360</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: control-room scorecard. Sticky header + section tabs, summary first, evidence (charts/tables) under each finding. */
/* Pio-Tech look (matches the AML Scenario Builder): navy primary + orange secondary, right-hand sidebar */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --surface-2:#f6f8fb; --fg:#142235; --fg-2:#3b4a5e; --muted:#56657a;
  --line:#d6dee8; --axis:#b3c0d0; --accent:#1d4e89; --accent-soft:#e2eaf5; --brand2:#e87d1e; --brand2-soft:#fdeedd;
  --s1:#1d4e89; --s2:#e87d1e; --s3:#1f9e6e; --s4:#c98a00;
  --st1:#2f6db5; --st2:#1f9e6e; --st3:#e0a100; --st4:#1f7a3d; --st5:#d55181; --st6:#c93a2f;
  --ok:#1f9e4a; --warn:#e8a317; --fail:#c93a2f; --na:#9aa6b6;
  --ok-ink:#1f7a3d; --warn-ink:#8a5a00; --fail-ink:#b42318;
  --font:"IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#121b2b; --surface-2:#0e1625; --fg:#e4eaf3; --fg-2:#c2cddc; --muted:#97a4b9;
  --line:#233149; --axis:#3a4b68; --accent:#7fa8e6; --accent-soft:#172a4b; --brand2:#f5a04a; --brand2-soft:#3a2612;
  --s1:#7fa8e6; --s2:#f5a04a; --s3:#3fc48a; --s4:#e0b040;
  --st1:#6f9ee0; --st2:#3fc48a; --st3:#e0b040; --st4:#5cc985; --st5:#e07aa0; --st6:#ff8a7d;
  --ok:#3fbf6a; --warn:#f0b45a; --fail:#ff7a6b; --na:#5c6b82;
  --ok-ink:#5cc985; --warn-ink:#f0b45a; --fail-ink:#ff8a7d; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#121b2b; --surface-2:#0e1625; --fg:#e4eaf3; --fg-2:#c2cddc; --muted:#97a4b9;
  --line:#233149; --axis:#3a4b68; --accent:#7fa8e6; --accent-soft:#172a4b; --brand2:#f5a04a; --brand2-soft:#3a2612;
  --s1:#7fa8e6; --s2:#f5a04a; --s3:#3fc48a; --s4:#e0b040;
  --st1:#6f9ee0; --st2:#3fc48a; --st3:#e0b040; --st4:#5cc985; --st5:#e07aa0; --st6:#ff8a7d;
  --ok:#3fbf6a; --warn:#f0b45a; --fail:#ff7a6b; --na:#5c6b82;
  --ok-ink:#5cc985; --warn-ink:#f0b45a; --fail-ink:#ff8a7d; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top > .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:18px;font-weight:700;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--muted)}
.top .meta{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.chip.sample{background:#fff3d6;color:#7a4f00}
:root[data-theme="dark"] .chip.sample{background:#3a2d0c;color:#fab219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.sample{background:#3a2d0c;color:#fab219}}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] button.primary{color:#08201a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#08201a}}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{border-top:1px solid var(--line);overflow-x:auto}
nav.tabs .wrap{display:flex;gap:4px;padding-block:0}
nav.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 12px;white-space:nowrap;color:var(--fg-2)}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
nav.tabs .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-start:6px;vertical-align:middle}
main{padding-block:24px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:22px;font-weight:700}
h2 small,h3 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-family:var(--mono)}
h3{font-size:16px;font-weight:600}
.lead{color:var(--fg-2);max-width:68ch;margin:6px 0 0}
section.view{display:flex;flex-direction:column;gap:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
/* hero summary */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.score{width:150px;height:150px;position:relative}
.score svg{width:100%;height:100%;transform:rotate(-90deg)}
.score .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score .num b{font-size:38px;font-weight:700;line-height:1}
.score .num span{font-size:12px;color:var(--muted)}
.tally{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.tally div{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-2)}
.tally b{font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:end;unicode-bidi:plaintext}
.kpi .v{text-align:start}
/* findings */
.findings{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.finding{display:grid;grid-template-columns:6px 1fr auto;gap:0 14px;align-items:stretch;border-top:1px solid var(--line)}
.finding:first-child{border-top:none}
.fwrap{border-top:1px solid var(--line)}
.fwrap:first-child{border-top:none}
.fwrap .finding{border-top:none;cursor:pointer}
.fwrap .finding:hover{background:var(--surface-2, rgba(127,127,127,.06))}
.fwrap .finding:focus-visible{outline:2px solid var(--s1);outline-offset:-2px}
.chev{display:inline-block;margin-inline-end:6px;color:var(--muted);transition:transform .15s;transform:scaleX(-1)}
[dir="ltr"] .chev{transform:none}
.fwrap.open .chev{transform:rotate(90deg)}
.drill{padding:4px 20px 16px;border-top:1px dashed var(--line)}
.drill td{white-space:nowrap}
.kvt{font-size:14px}
.bankhero{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-width:2px;border-color:var(--s1)}
.bh-l{font-size:13px;color:var(--muted)}.bh-l small{margin-inline-start:6px}
.bh-name{font-size:clamp(26px,5vw,36px);font-weight:700;margin:4px 0 10px;unicode-bidi:plaintext}
.bh-tags{display:flex;gap:8px;flex-wrap:wrap}
.bh-date{text-align:end;padding-inline-start:20px;border-inline-start:1px solid var(--line)}
.bh-d{font-size:clamp(22px,4vw,30px);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.bh-t{font-size:13px;color:var(--fg-2);direction:ltr}
@media (max-width:560px){.bh-date{text-align:start;padding-inline-start:0;border-inline-start:none;border-top:1px solid var(--line);padding-top:12px;width:100%}}
.kvr.k2{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.kvgrid.k3g{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));margin-top:16px}
.kvr.k3{grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) 76px}
.kvgrid .kvr.k3:last-child{border-bottom:none}
.kvh,.kvr{display:grid;grid-template-columns:36px minmax(0,1.1fr) minmax(0,1.4fr) 80px;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.kvh{font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--axis)}
.kvg{padding:14px 4px 6px;font-weight:700;font-size:13px;color:var(--s1);border-bottom:1px solid var(--line)}
.kvr:last-child{border-bottom:none}
.kn{color:var(--muted);font-family:var(--mono);font-size:12px}
.kvr .kl{color:var(--fg-2)}
.kvr .kvv{font-weight:600;text-align:right;unicode-bidi:plaintext}
.ks{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.kvr .dot{width:8px;height:8px;border-radius:50%;flex:none}
.kvr.s-info .dot{background:var(--accent)}
.kvr.s-ok .dot{background:var(--ok)}.kvr.s-warn .dot{background:var(--warn)}.kvr.s-fail .dot{background:var(--fail)}
.kvr.s-fail .kvv,.kvr.s-fail .ks{color:var(--fail-ink)}
@media (max-width:560px){.kvh{display:none}.kvr{grid-template-columns:28px 1fr auto;row-gap:2px}.kvr .kvv{grid-column:2/4}}
.kvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.kvgrid .panel{margin:0}
.kvlist{margin-top:10px;border-top:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kl{color:var(--fg-2);display:flex;align-items:center;gap:8px}
.kvv{font-weight:600;text-align:end;unicode-bidi:plaintext}
.kv .dot{width:8px;height:8px;border-radius:50%;background:var(--na);flex:none}
.kv.s-ok .dot{background:var(--ok)}.kv.s-warn .dot{background:var(--warn)}.kv.s-fail .dot{background:var(--fail)}
.kv.s-warn .kvv{color:var(--warn-ink,inherit)}.kv.s-fail .kvv{color:var(--fail-ink)}

.dbtn{font-size:12px;color:var(--s1);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--surface)}
.fwrap .finding:hover .dbtn{border-color:var(--s1)}
.finding .stripe{background:var(--na)}
.finding[data-s="ok"] .stripe{background:var(--ok)}
.finding[data-s="warn"] .stripe{background:var(--warn)}
.finding[data-s="fail"] .stripe{background:var(--fail)}
.finding .body{padding:12px 0;min-width:0}
.finding .t{font-weight:600}
.finding .t small{font-weight:400;color:var(--muted);margin-inline-start:6px;font-size:12px}
.finding .d{font-size:13px;color:var(--fg-2);margin-top:2px}
.finding .r{padding:12px 14px 12px 0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:end}
[dir="rtl"] .finding .r{padding:12px 0 12px 14px}
.finding .val{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill.ok{color:var(--ok-ink);background:color-mix(in srgb,var(--ok) 14%,transparent)} .pill.ok i{background:var(--ok)}
.pill.warn{color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 18%,transparent)} .pill.warn i{background:var(--warn)}
.pill.fail{color:var(--fail-ink);background:color-mix(in srgb,var(--fail) 14%,transparent)} .pill.fail i{background:var(--fail)}
.pill.na,.pill.info{color:var(--fg-2);background:var(--surface-2)} .pill.na i,.pill.info i{background:var(--na)}
.pill.info i{background:var(--s1)}
@media (max-width:560px){.finding{grid-template-columns:6px 1fr}.finding .r{grid-column:2;align-items:flex-start;padding:0 0 12px!important;flex-direction:row;flex-wrap:wrap;text-align:start}}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:460px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;font-size:12px;z-index:1}
th small{display:block;font-weight:400;color:var(--muted);font-family:var(--mono);font-size:10.5px}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;text-align:end}
td.code{font-family:var(--mono);direction:ltr;text-align:start}
td.wrap{white-space:normal;min-width:220px}
td{unicode-bidi:plaintext}
tr.flag td{background:color-mix(in srgb,var(--fail) 8%,transparent)}
tr.flagw td{background:color-mix(in srgb,var(--warn) 12%,transparent)}
details{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
details[open] summary{margin-bottom:10px}
.empty{color:var(--muted);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:10px;text-align:center}
/* charts */
.chart{position:relative;direction:ltr}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
@media (max-width:560px){.chart text{font-size:16px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden;direction:ltr}
.hb .fl{height:100%;border-radius:0 4px 4px 0;background:var(--s1)}
[dir="rtl"] .hb .tr{direction:rtl}
[dir="rtl"] .hb .fl{border-radius:4px 0 0 4px}
.hb .vv{font-family:var(--mono);font-size:12px;direction:ltr;min-width:60px;text-align:end}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;z-index:50;white-space:pre;font-family:var(--mono);direction:ltr}
/* loader */
.drop{border:1.5px dashed var(--axis);border-radius:12px;padding:22px;text-align:center;background:var(--surface);transition:border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:6px 0;color:var(--fg-2);font-size:14px}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;direction:ltr}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;color:var(--fg-2)}
.msg.err{color:var(--fail-ink)}
pre.sql{direction:ltr;text-align:left;font-family:var(--mono);font-size:12px;line-height:1.5;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:520px;margin:0}
ol.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;color:var(--fg-2)}
ol.steps b{color:var(--fg)}
kbd{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.en{color:var(--muted);font-size:12px}
.heat td.h{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:center;direction:ltr}
.heat th.s{cursor:pointer;user-select:none}
.heat th.s:hover{color:var(--accent)}
.heat th.on{color:var(--accent)}
.ovt tr.sgrp td{background:var(--surface-2);font-weight:700;font-size:13px}.ovt tr.sgrp small{font-weight:400;color:var(--muted);margin-inline-start:6px}
.ovt td.nm{white-space:normal}.ovt th,.ovt td{text-align:center;vertical-align:middle}.ovt td.nm,.ovt th:nth-child(2){text-align:start}.ovt tr.sgrp td:first-child{text-align:start}.ovt .ks{justify-content:center}
.bigk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bk{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.bk .l{font-weight:600;font-size:14px}.bk .l small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.bk .v{font-size:clamp(24px,5vw,34px);font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px}
.bk .s{font-size:12px;color:var(--fg-2)}
@media (max-width:560px){.bigk{grid-template-columns:1fr}}
.ks.s-info .dot{background:var(--accent)}.ks.s-info{color:var(--accent)}
.ks.s-ok .dot{background:var(--ok)}.ks.s-warn .dot{background:var(--warn)}.ks.s-fail .dot{background:var(--fail)}.ks.s-na .dot{background:var(--na)}
.ks .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.ks.s-fail{color:var(--fail-ink)}
@keyframes flashbg{0%,40%{background:color-mix(in srgb, var(--warn) 35%, transparent)}100%{background:transparent}}
.flash{animation:flashbg 2.2s ease-out}
.revt td{vertical-align:top}
.revlink{color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
[data-rev-go].bk:hover{border-color:var(--accent)}
.dcp{margin-top:16px}
.dch{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.dcn{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--mono);font-size:13px}
.dct td{vertical-align:middle}.dct tr.ref td{background:var(--surface-2);font-weight:600}
.dct tr.flagf td{background:color-mix(in srgb,var(--fail) 8%,transparent)}
.dq tr.sgrp td{background:var(--surface-2);font-weight:700;font-size:13px;text-align:start}.dq tr.sgrp small{font-weight:400;color:var(--muted);margin-inline-start:8px}
.dq td.nm{text-align:start}.dq td.code{text-align:center;font-size:12px}
.qbar{display:flex;align-items:center;gap:8px}.qbar span{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}.qbar span i{display:block;height:100%;border-radius:4px}
.qbar em{font-style:normal;font-family:var(--mono);font-size:12px;min-width:48px;text-align:end;direction:ltr}
@media (max-width:700px){.dq td:nth-child(2),.dq th:nth-child(2),.dq td:nth-child(4),.dq th:nth-child(4){display:none}.dq tr.sgrp td{display:table-cell}}
.kv2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));column-gap:28px}
a.dbtn{text-decoration:none;display:inline-block}
.kvr .kl,.kvr .kvv{overflow-wrap:anywhere;min-width:0}
.bk.area{display:flex;flex-direction:column;gap:6px}
.bk.area .ah{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.bk.area .ah .l{font-weight:600;font-size:14px}
.bk.area .ar{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}
.bk.area .ar b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.bk.area .ar b.cf{color:var(--fail-ink)}.bk.area .ar b.cw{color:var(--warn-ink)}
.bk.area .ap{border-bottom:none}.bk.area .ap b{font-size:24px}.c-ok{color:var(--ok-ink)}.c-warn{color:var(--warn-ink)}.c-fail{color:var(--fail-ink)}
.abar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}.abar i{display:block;height:100%}
.ddrow{gap:10px;align-items:center;margin-bottom:14px}.ddrow label{font-weight:600;font-size:14px}.ddrow select{flex:1;max-width:640px;padding:8px 10px;font-size:14px}
.subnav{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}.subnav button{border-radius:999px;font-size:13px;padding:6px 14px}.subnav button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sech{margin:28px 0 12px;padding-top:16px;border-top:2px solid var(--line)}.sech h2{font-size:20px}
.infog{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 18px}.infog>div{display:flex;flex-direction:column;gap:2px}.infog .l{font-size:12px;color:var(--muted)}.infog .l small{margin-inline-start:6px}.infog .v{font-weight:600;font-size:15px}
.verdict{border-width:2px}.verdict.s-fail{border-color:var(--fail)}.verdict.s-warn{border-color:var(--warn)}.verdict.s-ok{border-color:var(--ok)}
.verdict .vl{font-size:13px;color:var(--muted)}.verdict .vv{font-size:28px;font-weight:700;margin:4px 0}.verdict.s-fail .vv{color:var(--fail-ink)}.verdict .vv small{font-size:14px;font-weight:400;color:var(--muted)}.verdict .vs{font-size:13px;color:var(--fg-2)}
.ring{width:110px;height:110px;flex:none}.ring .rv{font-size:34px;font-weight:700;fill:var(--fg)}.ring .rs{font-size:12px;fill:var(--muted)}
.gear{font-size:inherit}
.lockp{max-width:440px;margin:24px auto;text-align:center}.lockp .lk{font-size:32px}.lkf{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.lkf .sq{flex:1;min-width:150px}
.sq.num{width:80px;flex:none;text-align:center}
.hbtn{font-size:12px;padding:3px 10px}
.fchip{border-radius:999px;font-size:13px;padding:4px 12px}.fchip b{font-family:var(--mono);font-weight:600;margin-inline-start:4px}.fchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sq{flex:1;min-width:160px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:13px}
tr.sel td{background:color-mix(in srgb, var(--s1) 12%, transparent)}
.scd{border-color:var(--s1)}
.sci{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.sci-r{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:8px;background:var(--surface-2)}
.sci-r small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sci-r .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--na)}
.sci-r.s-ok .dot{background:var(--ok)}.sci-r.s-warn .dot{background:var(--warn)}.sci-r.s-fail .dot{background:var(--fail)}
.sbar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface-2)}
.sbar i{display:block;min-width:3px}
.sno{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;color:#fff;font-family:var(--mono);font-size:12px;font-weight:600}
.pbar{display:flex;align-items:center;gap:8px}.pbar span{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}.pbar span i{display:block;height:100%;border-radius:4px}
.pbar em{font-style:normal;font-family:var(--mono);font-size:12px;min-width:44px;text-align:end;direction:ltr}
.stbl tr.sgrp td{background:var(--surface-2);font-weight:700;font-size:13px}.stbl tr.sgrp small{font-weight:400;color:var(--muted);margin-inline-start:6px}
.stbl tr.sgrp em{font-style:normal;font-family:var(--mono);font-size:12px}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (max-width:820px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{background:var(--surface);padding:14px;min-width:0;display:flex;flex-direction:column;gap:4px;position:relative}
.step .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.step .nm{font-weight:600;font-size:14px}
.step .ct{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.step .sub{font-size:12px;color:var(--fg-2)}
.step .bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.step .bar i{display:block;height:100%}
select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);max-width:100%}
ul.sugg{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;color:var(--fg-2)}
ul.sugg b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.pio{display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);padding-inline-start:10px;border-inline-start:1px solid var(--axis)}
body{margin:0}
#app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;align-items:start}
.side{grid-column:1;grid-row:1;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;padding:18px 14px;background:var(--surface);border-inline-end:1px solid var(--line);box-shadow:-8px 0 24px rgba(15,26,43,.04);overflow-y:auto}
.side-logo{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid var(--line)}
.side-logo .logo{height:28px}
.side-app{padding:0 6px}.side-app b{display:block;font-size:14px;font-weight:700;color:var(--fg)}.side-app small{font-size:11.5px;color:var(--muted)}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-nav button{display:flex;align-items:center;gap:10px;text-align:start;justify-content:flex-start;border:1px solid transparent;background:transparent;padding:9px 12px;border-radius:10px;color:var(--fg);font-weight:400;width:100%;white-space:normal}
.side-nav button svg{flex:none;color:var(--muted)}
.side-nav button span{display:flex;flex-direction:column;min-width:0}
.side-nav button b{font-size:13.5px;font-weight:600}
.side-nav button small{font-size:11.5px;color:var(--muted)}
.side-nav button:hover{background:var(--surface-2);border-color:var(--line)}
.side-nav button[aria-selected="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:inset -3px 0 0 var(--brand2)}
.side-nav button[aria-selected="true"] svg,.side-nav button[aria-selected="true"] b{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.side-foot button{justify-content:center;display:flex;align-items:center;gap:8px}
.side-prefs{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;padding:5px 6px;font-size:12px;background:var(--surface);color:var(--muted);justify-content:center}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
#app[dir="ltr"] .side-nav button[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--brand2)}
@media (max-width:900px){.side-prefs{flex-direction:row}.seg button{padding:4px 8px}}
.mainc{grid-column:2;grid-row:1;min-width:0}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top > .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.top .brand b{font-size:17px}
.panel{border-radius:10px;box-shadow:0 1px 2px rgba(15,26,43,.04)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] button.primary{color:#0a1630}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#0a1630}}
.ks.s-warn{color:var(--warn-ink)}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{grid-column:1;grid-row:1;position:sticky;top:0;z-index:6;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-inline-end:0;border-bottom:1px solid var(--line);box-shadow:none}
  .side-logo{border:0;padding:0}.side-logo .logo{height:22px}.side-app{display:none}
  .side-nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3;gap:4px;scrollbar-width:thin}
  .side-nav button{width:auto;flex:none;padding:6px 10px;white-space:nowrap}.side-nav small{display:none}.side-nav button svg{display:none}
  .side-nav button[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--brand2)}
  .side-foot{margin:0 0 0 auto;margin-inline-start:auto;flex-direction:row;border:0;padding:0}
  .mainc{grid-column:1;grid-row:2}
  header.top{position:static}
}
.sevarea{margin-top:10px}.sevarea summary{cursor:pointer;padding:8px 2px;font-size:14px}
.sevt td{vertical-align:middle}.sevt tr.grow td{background:var(--soft,rgba(29,78,137,.06));font-weight:700;font-size:12px;color:var(--ink2,inherit)}
.sevt select.sevsel{width:100%;padding:4px 6px}.sevt tr.sevset td{background:rgba(232,125,30,.08)}

#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:radial-gradient(1200px 600px at 85% -10%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 60%),radial-gradient(800px 500px at -10% 110%,color-mix(in srgb,var(--brand2) 18%,transparent),transparent 60%),var(--bg);font-family:var(--font);color:var(--fg)}
#login .lgbox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 26px 18px;box-shadow:0 20px 60px rgba(13,30,60,.18);display:flex;flex-direction:column;gap:10px}
#login .lgtop{display:flex;align-items:center;gap:10px;margin-bottom:6px}#login .lgtop .logo{height:26px}
#login .lglang{font-size:12px;padding:4px 10px}
#login .lgmark{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px;border-bottom:1px solid var(--line);margin-bottom:6px}
#login .lgmark b{font-size:34px;font-weight:700;color:var(--accent);letter-spacing:.5px;direction:ltr}#login .lgmark b:after{content:"";display:block;height:4px;width:46px;margin:6px auto 0;border-radius:2px;background:var(--brand2)}
#login .lgmark span{font-size:13px;color:var(--muted);margin-top:6px}
#login h2{margin:6px 0 0;font-size:18px}#login .lead{margin:0 0 4px;font-size:13px}
#login .sq{width:100%;padding:10px 12px;font-size:14px}#login .primary{padding:10px;font-size:14px}
#login .msg{min-height:18px;margin:0}#login .lgft{font-size:11px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.side-foot .logout{color:var(--muted)}
.home .hhero{display:flex;gap:30px;align-items:center;padding:28px 30px;background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--accent-soft) 70%,var(--surface)));border-inline-start:5px solid var(--brand2)}
.home .h360{width:150px;height:150px;flex:none}.home .h360 .t1{font:700 40px var(--font);fill:var(--fg)}.home .h360 .t2{font:600 15px var(--font);fill:var(--muted);letter-spacing:3px}
.home .hk{font-size:11.5px;letter-spacing:1.5px;color:var(--brand2);font-weight:700;direction:ltr;text-align:start}
.home h1{margin:2px 0 0;font-size:40px;line-height:1.1;color:var(--accent);direction:ltr;text-align:start}
html:not([lang="en"]) .home h1,html:not([lang="en"]) .home .hk{text-align:right}
.home .hs{font-size:17px;font-weight:600;color:var(--fg-2);margin-top:4px}.home .hh p{color:var(--fg-2);font-size:14px;line-height:1.8;margin:12px 0 0;max-width:720px}
.home .hsec{margin:26px 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}.home .hsec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--brand2)}
.home .hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.home .hcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;transition:border-color .15s,transform .15s,box-shadow .15s}
.home .hcard:hover,.home .hcard:focus-visible{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(13,30,60,.10)}
.home .hic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.home .hn{position:absolute;top:16px;inset-inline-end:18px;font:600 13px var(--mono);color:var(--axis)}
.home .hcard b{font-size:15px;color:var(--fg)}.home .hd{font-size:12.5px;color:var(--muted);line-height:1.7;display:block}
.home .hgo{margin-top:auto;font-size:12.5px;font-weight:600;color:var(--accent)}
.home .hsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.home .hstep{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.home .hstep:hover{border-color:var(--accent)}.home .hstep b{display:block;font-size:14px;margin-bottom:2px}
.home .hsn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:700;font-size:14px}
@media (max-width:640px){.home .hhero{flex-direction:column;text-align:center;padding:22px 18px}.home .h360{width:120px;height:120px}.home h1,.home .hk{text-align:center!important}.home .hhero .row{justify-content:center}}
#app[hidden],#login[hidden]{display:none!important}
.dbwrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
@media (max-width:900px){.dbwrap{grid-template-columns:1fr}}
.dbcard .dbh{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dbcard .dbi{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.dbcard .dbn{font:700 22px var(--mono);color:var(--fg);direction:ltr;text-align:start;overflow-wrap:anywhere}

.dbcard .dbr .kl{font-size:12px;color:var(--muted)}.dbcard .dbr .kvv{font-size:14px;font-weight:600;direction:ltr;text-align:start;overflow-wrap:anywhere}

.verdict .vp b{font-family:var(--mono);font-size:14px}.verdict .vp .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.verdict .vp.p-fail{background:color-mix(in srgb,var(--fail) 12%,transparent);color:var(--fail-ink)}.verdict .vp.p-fail .dot{background:var(--fail)}
.verdict .vp.p-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn-ink)}.verdict .vp.p-warn .dot{background:var(--warn)}
.verdict .vmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.verdict .vmeta .chip{font-size:12px}
.sbbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px}.sbbar .sbdot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}.sbbar .err{color:var(--fail-ink)}
#login .lgsb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}#login .lgsb a{color:var(--accent);cursor:pointer;text-decoration:underline}
#login .sbdot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
#login .sbform{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:10px}
.side-user{font-size:11.5px;color:var(--muted);text-align:center;direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
const SQL_SCRIPT = "/* =====================================================================\n   PIO AML - SCENARIOS & ALERTS STUDY - DATA EXTRACT   (schema BI_DWH, Oracle)\n   ---------------------------------------------------------------------\n   HOW TO RUN IN TOAD\n   1. Connect to the AML database. If not connected as BI_DWH run first:\n          ALTER SESSION SET CURRENT_SCHEMA = BI_DWH;\n   2. FILTER: Toad asks once for COUNTRY_CODE and INST_CODE\n      (as stored in PIO_AML_CUSTOMERS). Only that country/institution is read.\n      To list the available codes first run:\n          SELECT COUNTRY_CODE, INST_CODE, COUNT(*) FROM PIO_AML_CUSTOMERS\n           GROUP BY COUNTRY_CODE, INST_CODE ORDER BY 3 DESC;\n   3. Put the cursor inside the query and press F9 (Execute Statement).\n   4. Right-click the grid > Export Dataset > Excel (.xlsx) or CSV,\n      with column headers and all rows.  Save as AML_SA_<BANK>_<YYYYMMDD>.xlsx\n   5. Load the file in the \"AML 360\" app (or send it to Claude).\n\n   CURRENT_STEP codes: 1 New, 2 Under investigation, 3 Under approval,\n   4 Approved, 5 Returned level 2 -> level 1 (re-investigation),\n   6 Sent to violations.\n   Output shape: CHECK_ID, RN, C1..C12 (text). Read-only query.\n   ===================================================================== */\n\n-- [K0] Run info & KPIs\nSELECT 'K0' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, NULL AS C3, NULL AS C4, NULL AS C5, NULL AS C6, NULL AS C7, NULL AS C8, NULL AS C9, NULL AS C10, NULL AS C11, NULL AS C12\n  FROM (SELECT C1 AS X1, C2 AS X2\n  FROM (\n    SELECT 1 AS ORD, 'RUN_TS' AS C1, TO_CHAR(SYSDATE,'YYYY-MM-DD HH24:MI') AS C2 FROM DUAL\n    UNION ALL SELECT 2 AS ORD, 'DB_NAME' AS C1, SYS_CONTEXT('USERENV','DB_NAME') AS C2 FROM DUAL\n    UNION ALL SELECT 3 AS ORD, 'DB_USER' AS C1, USER AS C2 FROM DUAL\n    UNION ALL SELECT 4 AS ORD, 'DB_UNIQUE_NAME' AS C1, SYS_CONTEXT('USERENV','DB_UNIQUE_NAME') AS C2 FROM DUAL\n    UNION ALL SELECT 5 AS ORD, 'DB_SERVICE' AS C1, SYS_CONTEXT('USERENV','SERVICE_NAME') AS C2 FROM DUAL\n    UNION ALL SELECT 6 AS ORD, 'DB_INSTANCE' AS C1, SYS_CONTEXT('USERENV','INSTANCE_NAME') AS C2 FROM DUAL\n    UNION ALL SELECT 7 AS ORD, 'DB_HOST' AS C1, SYS_CONTEXT('USERENV','SERVER_HOST') AS C2 FROM DUAL\n    UNION ALL SELECT 8 AS ORD, 'DB_SCHEMA' AS C1, SYS_CONTEXT('USERENV','CURRENT_SCHEMA') AS C2 FROM DUAL\n    UNION ALL SELECT 9 AS ORD, 'DB_VERSION' AS C1, MAX(VERSION) AS C2 FROM PRODUCT_COMPONENT_VERSION WHERE PRODUCT LIKE 'Oracle%'\n    UNION ALL SELECT 10 AS ORD, 'COUNTRY_CODE' AS C1, '&&COUNTRY_CODE' AS C2 FROM DUAL\n    UNION ALL SELECT 11 AS ORD, 'INST_CODE' AS C1, '&&INST_CODE' AS C2 FROM DUAL\n    UNION ALL SELECT 12 AS ORD, 'BANK_NAME' AS C1, MAX(PARAM_VALUE) AS C2 FROM PIO_BANKBI_PARAMETERS WHERE CODE = 'BankName'\n    UNION ALL SELECT 13 AS ORD, 'LAST_ALERT_DATE' AS C1, TO_CHAR(MAX(DAY_DATE),'YYYY-MM-DD') AS C2 FROM PIO_AML_CUSTOMERS WHERE TO_CHAR(COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 14 AS ORD, 'FIRST_ALERT_DATE' AS C1, TO_CHAR(MIN(DAY_DATE),'YYYY-MM-DD') AS C2 FROM PIO_AML_CUSTOMERS WHERE TO_CHAR(COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 15 AS ORD, 'ALERTS_TOTAL' AS C1, TO_CHAR(COUNT(*)) AS C2 FROM PIO_AML_CUSTOMERS WHERE TO_CHAR(COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 16 AS ORD, 'ALERTS_30D' AS C1, TO_CHAR(COUNT(*)) AS C2 FROM PIO_AML_CUSTOMERS WHERE TO_CHAR(COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(INST_CODE) = '&&INST_CODE' AND DAY_DATE >= TRUNC(SYSDATE) - 30\n    UNION ALL SELECT 17 AS ORD, 'TOTAL_SCEN' AS C1, TO_CHAR(COUNT(*)) AS C2 FROM PIO_AML_SCENARIO WHERE TO_CHAR(COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 18 AS ORD, 'ACTIVE_SCEN' AS C1, TO_CHAR(COUNT(*)) AS C2 FROM PIO_AML_SCENARIO WHERE TO_CHAR(COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(INST_CODE) = '&&INST_CODE' AND ACTIVE_FLAG IN ('1','Y')\n  ) ORDER BY ORD)\nUNION ALL\n-- [SC] Scenario master\nSELECT 'SC' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, X3 AS C3, X4 AS C4, X5 AS C5, X6 AS C6, X7 AS C7, X8 AS C8, X9 AS C9, X10 AS C10, X11 AS C11, X12 AS C12\n  FROM (SELECT TO_CHAR(s.SCENARIO_CODE) AS X1, TO_CHAR(MAX(s.SCENARIO_DES_ENG)) AS X2, TO_CHAR(MAX(s.SCENARIO_DES_NAT_LAN)) AS X3, TO_CHAR(MAX(c.CATEGORY_ENG_NAME)) AS X4, TO_CHAR(MAX(s.ACTIVE_FLAG)) AS X5, TO_CHAR(MAX(s.RUN_FLAG)) AS X6, TO_CHAR(MAX(s.VIOLATION_LEVEL)) AS X7, TO_CHAR(MAX(s.USE_WATCHLIST_FLAG)) AS X8, TO_CHAR(COUNT(DISTINCT sr.AML_RULE_CODE)) AS X9, TO_CHAR(MIN(r.PERIOD_DAYS)) AS X10, TO_CHAR(MAX(r.PERIOD_DAYS)) AS X11, TO_CHAR(MAX(s.UPDATED_DATE),'YYYY-MM-DD') AS X12\n  FROM PIO_AML_SCENARIO s\n  LEFT JOIN PIO_AML_SCENARIO_CATEGORY c ON c.CATEGORY_CODE = s.CATEGORY_CODE AND c.COUNTRY_CODE = s.COUNTRY_CODE AND c.INST_CODE = s.INST_CODE\n  LEFT JOIN PIO_AML_SCENARIO_RULES sr ON sr.AML_SCENARIO = s.SCENARIO_CODE AND sr.COUNTRY_CODE = s.COUNTRY_CODE AND sr.INST_CODE = s.INST_CODE\n  LEFT JOIN PIO_AML_RULES r ON r.RULE_CODE = sr.AML_RULE_CODE AND r.COUNTRY_CODE = sr.COUNTRY_CODE AND r.INST_CODE = sr.INST_CODE\n  WHERE TO_CHAR(s.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(s.INST_CODE) = '&&INST_CODE'\n  GROUP BY s.COUNTRY_CODE, s.INST_CODE, s.SCENARIO_CODE\n  ORDER BY s.SCENARIO_CODE)\n WHERE ROWNUM <= 2000\nUNION ALL\n-- [ST] Alerts by scenario and current step\nSELECT 'ST' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, X3 AS C3, X4 AS C4, X5 AS C5, X6 AS C6, X7 AS C7, X8 AS C8, X9 AS C9, NULL AS C10, NULL AS C11, NULL AS C12\n  FROM (SELECT TO_CHAR(AML_SCENARIO_CODE) AS X1, TO_CHAR(NVL(CURRENT_STEP,'-')) AS X2, TO_CHAR(COUNT(*)) AS X3, TO_CHAR(MIN(DAY_DATE),'YYYY-MM-DD') AS X4, TO_CHAR(MAX(DAY_DATE),'YYYY-MM-DD') AS X5, TO_CHAR(ROUND(AVG(TRUNC(SYSDATE) - DAY_DATE),1)) AS X6, TO_CHAR(MAX(TRUNC(SYSDATE) - DAY_DATE)) AS X7, TO_CHAR(SUM(CASE WHEN DAY_DATE >= TRUNC(SYSDATE) - 30 THEN 1 ELSE 0 END)) AS X8, TO_CHAR(SUM(CASE WHEN TRUNC(SYSDATE) - DAY_DATE > 30 THEN 1 ELSE 0 END)) AS X9\n  FROM PIO_AML_CUSTOMERS WHERE TO_CHAR(COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(INST_CODE) = '&&INST_CODE'\n  GROUP BY AML_SCENARIO_CODE, NVL(CURRENT_STEP,'-')\n  ORDER BY AML_SCENARIO_CODE, 2)\n WHERE ROWNUM <= 5000\nUNION ALL\n-- [TM] Alert timing per scenario\nSELECT 'TM' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, X3 AS C3, X4 AS C4, X5 AS C5, X6 AS C6, X7 AS C7, X8 AS C8, X9 AS C9, X10 AS C10, NULL AS C11, NULL AS C12\n  FROM (SELECT TO_CHAR(AML_SCENARIO_CODE) AS X1, TO_CHAR(COUNT(*)) AS X2, TO_CHAR(COUNT(DISTINCT DAY_DATE)) AS X3, TO_CHAR(MIN(DAY_DATE),'YYYY-MM-DD') AS X4, TO_CHAR(MAX(DAY_DATE),'YYYY-MM-DD') AS X5, TO_CHAR(TRUNC(SYSDATE) - MAX(DAY_DATE)) AS X6, TO_CHAR(ROUND(AVG(CASE WHEN CREATION_DATE IS NOT NULL THEN CREATION_DATE - DAY_DATE END),2)) AS X7, TO_CHAR(ROUND(MAX(CASE WHEN CREATION_DATE IS NOT NULL THEN CREATION_DATE - DAY_DATE END),2)) AS X8, TO_CHAR(COUNT(DISTINCT CUS_NUM)) AS X9, TO_CHAR(SUM(CASE WHEN DAY_DATE >= TRUNC(SYSDATE) - 90 THEN 1 ELSE 0 END)) AS X10\n  FROM PIO_AML_CUSTOMERS WHERE TO_CHAR(COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(INST_CODE) = '&&INST_CODE'\n  GROUP BY AML_SCENARIO_CODE\n  ORDER BY COUNT(*) DESC)\n WHERE ROWNUM <= 2000\nUNION ALL\n-- [SM] Monthly alerts per scenario (12 months)\nSELECT 'SM' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, X3 AS C3, NULL AS C4, NULL AS C5, NULL AS C6, NULL AS C7, NULL AS C8, NULL AS C9, NULL AS C10, NULL AS C11, NULL AS C12\n  FROM (SELECT TO_CHAR(TRUNC(DAY_DATE,'MM'),'YYYY-MM-DD') AS X1, TO_CHAR(AML_SCENARIO_CODE) AS X2, TO_CHAR(COUNT(*)) AS X3\n  FROM PIO_AML_CUSTOMERS WHERE TO_CHAR(COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(INST_CODE) = '&&INST_CODE' AND DAY_DATE >= ADD_MONTHS(TRUNC(SYSDATE,'MM'), -11)\n  GROUP BY TRUNC(DAY_DATE,'MM'), AML_SCENARIO_CODE ORDER BY 1)\n WHERE ROWNUM <= 6000\nUNION ALL\n-- [SD] Daily alerts per scenario (60 days)\nSELECT 'SD' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, X3 AS C3, NULL AS C4, NULL AS C5, NULL AS C6, NULL AS C7, NULL AS C8, NULL AS C9, NULL AS C10, NULL AS C11, NULL AS C12\n  FROM (SELECT TO_CHAR(DAY_DATE,'YYYY-MM-DD') AS X1, TO_CHAR(AML_SCENARIO_CODE) AS X2, TO_CHAR(COUNT(*)) AS X3\n  FROM PIO_AML_CUSTOMERS WHERE TO_CHAR(COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(INST_CODE) = '&&INST_CODE' AND DAY_DATE >= TRUNC(SYSDATE) - 60\n  GROUP BY DAY_DATE, AML_SCENARIO_CODE ORDER BY 1)\n WHERE ROWNUM <= 8000\nUNION ALL\n-- [SF] Final status per scenario\nSELECT 'SF' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, X3 AS C3, X4 AS C4, NULL AS C5, NULL AS C6, NULL AS C7, NULL AS C8, NULL AS C9, NULL AS C10, NULL AS C11, NULL AS C12\n  FROM (SELECT TO_CHAR(a.AML_SCENARIO_CODE) AS X1, TO_CHAR(NVL(a.FINAL_STATUS,'-')) AS X2, TO_CHAR(MAX(f.DES_ENG)) AS X3, TO_CHAR(COUNT(*)) AS X4\n  FROM PIO_AML_CUSTOMERS a\n  LEFT JOIN PIO_AML_FINAL_STATUS f ON f.STATUS_CODE = a.FINAL_STATUS\n  WHERE TO_CHAR(a.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(a.INST_CODE) = '&&INST_CODE'\n  GROUP BY a.AML_SCENARIO_CODE, NVL(a.FINAL_STATUS,'-') ORDER BY 1, 4 DESC)\n WHERE ROWNUM <= 3000\nUNION ALL\n-- [SP] Site parameters (CHECK_BANK_PARAMETERS)\nSELECT 'SP' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, X3 AS C3, X4 AS C4, X5 AS C5, X6 AS C6, X7 AS C7, NULL AS C8, NULL AS C9, NULL AS C10, NULL AS C11, NULL AS C12\n  FROM (SELECT C1 AS X1, C2 AS X2, C3 AS X3, C4 AS X4, C5 AS X5, TO_CHAR(C6) AS X6, C7 AS X7\n  FROM (\n    SELECT 1 AS ORD, 'AML_CONFIGRATIONS' AS C1, 'COUNTRY SITE' AS C2, 'The country code defined for the site' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE (SELECT MAX(r.DES_ENG) FROM PIO_REGIONS r WHERE TO_CHAR(r.COUNTRY_CODE) = p.PARAM_VALUE) END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'DeafultCountryCode' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'DeafultCountryCode'\n    UNION ALL SELECT 2 AS ORD, 'AML_CONFIGRATIONS' AS C1, 'ENGINE USE CUSTOMER' AS C2, 'Whether AML Engine uses PIO_CUSTOMERS or PIO_CUSTOMERS_TMP' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE CASE WHEN p.PARAM_VALUE = '1' THEN 'PIO_CUSTOMERS' WHEN p.PARAM_VALUE = '0' THEN 'PIO_CUSTOMERS_TMP' ELSE 'NOT USED' END END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_USE_CUSTOMER_TMP' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_USE_CUSTOMER_TMP'\n    UNION ALL SELECT 3 AS ORD, 'AML_WORKFLOW' AS C1, 'WORKFLOW USED' AS C2, 'Default workflow or branches workflow' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE CASE WHEN p.PARAM_VALUE = '1' THEN 'DEFAULT' WHEN p.PARAM_VALUE = '2' THEN 'BRANCHES' ELSE 'NOT USED' END END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_WORKFLOW_TYPE' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_WORKFLOW_TYPE'\n    UNION ALL SELECT 4 AS ORD, 'AML_API' AS C1, 'API USED BRANCH' AS C2, 'Branch used by the API' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE (SELECT MAX(b.NAME_ENG) FROM PIO_BRANCHES b WHERE TO_CHAR(b.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(b.INST_CODE) = '&&INST_CODE' AND b.BRA_CODE = p.PARAM_VALUE) END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_API_DEFUALT_BRANCH' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_API_DEFUALT_BRANCH'\n    UNION ALL SELECT 5 AS ORD, 'AML_CONFIGRATIONS' AS C1, 'AML_CHANNEL_TYPE' AS C2, 'Used by FILL_PIO_AML_WATCHLIST_VIEW (1 INQUERY, 2 API)' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE CASE WHEN p.PARAM_VALUE = '1' THEN 'INQUERY' WHEN p.PARAM_VALUE = '2' THEN 'API' ELSE 'NOT USED' END END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_CHANNEL_TYPE' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_CHANNEL_TYPE'\n    UNION ALL SELECT 6 AS ORD, 'AML_CONFIGRATIONS' AS C1, 'BANK NAME' AS C2, 'Bank name' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE TO_CHAR(p.PARAM_VALUE) END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'BankName' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'BankName'\n    UNION ALL SELECT 7 AS ORD, 'AML_CONFIGRATIONS' AS C1, 'AML_TRANSACTIONS_SOURCE_FLAG' AS C2, '1 = TRANSACT, 2 = TRANSACT_TEMP' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE CASE WHEN p.PARAM_VALUE = '1' THEN 'TRANSACT' WHEN p.PARAM_VALUE = '2' THEN 'TRANSACT_TEMP' ELSE 'NOT USED' END END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_TRANSACTIONS_SOURCE_FLAG' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_TRANSACTIONS_SOURCE_FLAG'\n    UNION ALL SELECT 8 AS ORD, 'AML_CONFIGRATIONS' AS C1, 'AML_ALLOW_ZERO_ATTACHMENT' AS C2, 'Forward an alert without attachment (1 = Active)' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE CASE WHEN p.PARAM_VALUE = '0' THEN 'INACTIVE' WHEN p.PARAM_VALUE = '1' THEN 'ACTIVE' ELSE 'NOT USED' END END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_ALLOW_ZERO_ATTACHMENT' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_ALLOW_ZERO_ATTACHMENT'\n    UNION ALL SELECT 9 AS ORD, 'AML_SCRENING' AS C1, 'AML_Disable_Main_Screning_Fieleds' AS C2, 'Enable/Disable fields on Watchlist Checker screen' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE TO_CHAR(p.PARAM_VALUE) END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_Disable_Main_Screning_Fieleds' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_Disable_Main_Screning_Fieleds'\n    UNION ALL SELECT 10 AS ORD, 'AML_SCRENING' AS C1, 'AML_ENABLE_SLIDER' AS C2, 'Enable/Disable slider on Watchlist Checker screen' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE TO_CHAR(p.PARAM_VALUE) END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_ENABLE_SLIDER' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_ENABLE_SLIDER'\n    UNION ALL SELECT 11 AS ORD, 'AML_CONFIGRATIONS' AS C1, 'AML_EXCLUDE_OLD_TRANS' AS C2, '0 = scan all, 1 = exclude transactions already in PIO_AML_CUSTOMER_DETAILS' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE TO_CHAR(p.PARAM_VALUE) END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_EXCLUDE_OLD_TRANS' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_EXCLUDE_OLD_TRANS'\n    UNION ALL SELECT 12 AS ORD, 'AML_SCRENING' AS C1, 'AML_FILTER_SCORE' AS C2, 'Similarity % used when comparing two text fields' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE TO_CHAR(p.PARAM_VALUE) END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_FILTER_SCORE' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_FILTER_SCORE'\n    UNION ALL SELECT 13 AS ORD, 'AML_CONFIGRATIONS' AS C1, 'AML_JOBBASKET_PERIOD' AS C2, 'JobBasket From/To dates period' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE TO_CHAR(p.PARAM_VALUE) END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_JOBBASKET_PERIOD' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_JOBBASKET_PERIOD'\n    UNION ALL SELECT 14 AS ORD, 'AML_CONFIGRATIONS' AS C1, 'AML_Num_Tabs_jobBasket' AS C2, 'Number of alert tabs in JobBasket' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE TO_CHAR(p.PARAM_VALUE) END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_Num_Tabs_jobBasket' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_Num_Tabs_jobBasket'\n    UNION ALL SELECT 15 AS ORD, 'AML_CONFIGRATIONS' AS C1, 'AML_USED_OUTWARD_FLAG' AS C2, 'Include PIO_OUTWARD_CENTRAL_TRANSFERS in scenarios' AS C3, CASE WHEN p.CODE IS NULL THEN 'NOT DEFINED' ELSE CASE WHEN p.PARAM_VALUE = '0' THEN 'NOT USED' WHEN p.PARAM_VALUE = '1' THEN 'USED' ELSE 'NOT USED' END END AS C4, TO_CHAR(p.PARAM_VALUE) AS C5, CAST(NULL AS NUMBER) AS C6, 'AML_USED_OUTWARD_FLAG' AS C7 FROM DUAL LEFT JOIN PIO_BANKBI_PARAMETERS p ON p.CODE = 'AML_USED_OUTWARD_FLAG'\n    UNION ALL SELE LL SELECT 14 AS ORD, 'SIMILARITY' AS C1, 'INS_MNL_SCN_PIO_AML_CUS_WL' AS C2, SUBSTR(m.INS_MNL_SCN_PIO_AML_CUS_WL,1,400) AS C3, TO_CHAR(m.INST_CODE) AS C4, CAST(NULL AS VARCHAR2(400)) AS C5, CAST(NULL AS VARCHAR2(400)) AS C6, CAST(NULL AS VARCHAR2(400)) AS C7, CAST(NULL AS VARCHAR2(400)) AS C8, CAST(NULL AS VARCHAR2(400)) AS C9 FROM PIO_API_SIMILARITY m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 15 AS ORD, 'SIMILARITY' AS C1, 'INS_MNL_SCN_PIO_AML_CUS' AS C2, SUBSTR(m.INS_MNL_SCN_PIO_AML_CUS,1,400) AS C3, TO_CHAR(m.INST_CODE) AS C4, CAST(NULL AS VARCHAR2(400)) AS C5, CAST(NULL AS VARCHAR2(400)) AS C6, CAST(NULL AS VARCHAR2(400)) AS C7, CAST(NULL AS VARCHAR2(400)) AS C8, CAST(NULL AS VARCHAR2(400)) AS C9 FROM PIO_API_SIMILARITY m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 16 AS ORD, 'SIMILARITY' AS C1, 'INSERT_PIO_AML_ENGINE_LOG' AS C2, SUBSTR(m.INSERT_PIO_AML_ENGINE_LOG,1,400) AS C3, TO_CHAR(m.INST_CODE) AS C4, CAST(NULL AS VARCHAR2(400)) AS C5, CAST(NULL AS VARCHAR2(400)) AS C6, CAST(NULL AS VARCHAR2(400)) AS C7, CAST(NULL AS VARCHAR2(400)) AS C8, CAST(NULL AS VARCHAR2(400)) AS C9 FROM PIO_API_SIMILARITY m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 17 AS ORD, 'SIMILARITY' AS C1, 'INS_PIO_SCN_RES_LOG' AS C2, SUBSTR(m.INS_PIO_SCN_RES_LOG,1,400) AS C3, TO_CHAR(m.INST_CODE) AS C4, CAST(NULL AS VARCHAR2(400)) AS C5, CAST(NULL AS VARCHAR2(400)) AS C6, CAST(NULL AS VARCHAR2(400)) AS C7, CAST(NULL AS VARCHAR2(400)) AS C8, CAST(NULL AS VARCHAR2(400)) AS C9 FROM PIO_API_SIMILARITY m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 18 AS ORD, 'SIMILARITY' AS C1, 'INSERT_FILL_HIS_PROCEDURE' AS C2, SUBSTR(m.INSERT_FILL_HIS_PROCEDURE,1,400) AS C3, TO_CHAR(m.INST_CODE) AS C4, CAST(NULL AS VARCHAR2(400)) AS C5, CAST(NULL AS VARCHAR2(400)) AS C6, CAST(NULL AS VARCHAR2(400)) AS C7, CAST(NULL AS VARCHAR2(400)) AS C8, CAST(NULL AS VARCHAR2(400)) AS C9 FROM PIO_API_SIMILARITY m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 50, 'NO_SIMILARITY', 'PIO_API_SIMILARITY', 'NOT DEFINED', NULL, NULL, NULL, NULL, NULL, NULL FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM PIO_API_SIMILARITY m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE')\n    UNION ALL SELECT 60, 'SCHEDULE', TO_CHAR(s.SCHEDULETYPE), s.HOUR || ':' || LPAD(NVL(s.MINUTE,'0'),2,'0'), TO_CHAR(s.ISACTIVE), TO_CHAR(s.DAY), TO_CHAR(s.MONTH), TO_CHAR(s.DAYOFWEEK), TO_CHAR(s.INST_CODE), TO_CHAR(NVL(s.UPDATED_DATE, s.CREATED_DATE),'YYYY-MM-DD') FROM PIO_API_SCHEDULES_FIXED s WHERE TO_CHAR(s.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(s.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 80, 'MANUAL_LOG', 'PIO_SCREENING_RESULT_LOG', TO_CHAR(COUNT(*)), TO_CHAR(SUM(CASE WHEN l.SCREENING_DATE >= TRUNC(SYSDATE) - 30 THEN 1 ELSE 0 END)), TO_CHAR(MAX(l.SCREENING_DATE),'YYYY-MM-DD'), TO_CHAR(COUNT(DISTINCT l.USER_CODE)), TO_CHAR(TRUNC(SYSDATE) - TRUNC(MAX(l.SCREENING_DATE))), NULL, NULL FROM PIO_SCREENING_RESULT_LOG l WHERE TO_CHAR(l.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(l.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 90, 'WL_DELTA', 'PIO_WATCHLIST_SDN_AKA_DELTA', TO_CHAR(MAX(d.DAY_DATE),'YYYY-MM-DD'), TO_CHAR(TRUNC(SYSDATE) - TRUNC(MAX(d.DAY_DATE))), TO_CHAR(COUNT(*)), NULL, NULL, NULL, NULL FROM PIO_WATCHLIST_SDN_AKA_DELTA d\n    UNION ALL SELECT 91, 'WL_DELTA_LAST', 'PIO_WATCHLIST_SDN_AKA_DELTA', TO_CHAR(COUNT(*)), TO_CHAR(COUNT(DISTINCT d.LIST_ID)), NULL, NULL, NULL, NULL, NULL FROM PIO_WATCHLIST_SDN_AKA_DELTA d, (SELECT MAX(z.DAY_DATE) AS MX FROM PIO_WATCHLIST_SDN_AKA_DELTA z) md WHERE d.DAY_DATE = md.MX\n  ) ORDER BY ORD, C2)\n WHERE ROWNUM <= 1000\nUNION ALL\n-- [ER] Screening engine runs (PIO_AML_ENGINE_LOG) and delta source\nSELECT 'ER' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, X3 AS C3, X4 AS C4, X5 AS C5, X6 AS C6, X7 AS C7, X8 AS C8, X9 AS C9, X10 AS C10, X11 AS C11, X12 AS C12\n  FROM (SELECT C1 AS X1, C2 AS X2, C3 AS X3, C4 AS X4, C5 AS X5, C6 AS X6, C7 AS X7, C8 AS X8, C9 AS X9, C10 AS X10, C11 AS X11, C12 AS X12\n  FROM (\n    SELECT 1 AS ORD, 'SUM' AS C1, TO_CHAR(e.ENGINE_NAME) AS C2, TO_CHAR(COUNT(*)) AS C3, TO_CHAR(MIN(e.DAY_DATE),'YYYY-MM-DD') AS C4, TO_CHAR(MAX(e.DAY_DATE),'YYYY-MM-DD HH24:MI') AS C5, TO_CHAR(TRUNC(SYSDATE) - TRUNC(MAX(e.DAY_DATE))) AS C6, TO_CHAR(SUM(CASE WHEN e.DAY_DATE >= TRUNC(SYSDATE) - 30 THEN 1 ELSE 0 END)) AS C7, TO_CHAR(MAX(e.NO_OF_CUSTOMERS) KEEP (DENSE_RANK LAST ORDER BY e.DAY_DATE)) AS C8, TO_CHAR(MAX(e.NO_OF_SUSP) KEEP (DENSE_RANK LAST ORDER BY e.DAY_DATE)) AS C9, TO_CHAR(ROUND(AVG(e.TIME_ELAPSED_SEC))) AS C10, TO_CHAR(MAX(e.TIME_ELAPSED_SEC) KEEP (DENSE_RANK LAST ORDER BY e.DAY_DATE)) AS C11, CAST(NULL AS VARCHAR2(40)) AS C12 FROM PIO_AML_ENGINE_LOG e WHERE TO_CHAR(e.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(e.INST_CODE) = '&&INST_CODE' GROUP BY e.ENGINE_NAME\n    UNION ALL SELECT 2, 'RUN', TO_CHAR(x.ENGINE_NAME), TO_CHAR(x.DAY_DATE,'YYYY-MM-DD HH24:MI'), TO_CHAR(x.NO_OF_CUSTOMERS), TO_CHAR(x.NO_OF_SUSP), TO_CHAR(x.TIME_ELAPSED_SEC), TO_CHAR(x.MATCHING_SCORE), NULL, NULL, NULL, NULL, NULL FROM (SELECT e.*, ROW_NUMBER() OVER (PARTITION BY e.ENGINE_NAME ORDER BY e.DAY_DATE DESC) AS RNK FROM PIO_AML_ENGINE_LOG e WHERE TO_CHAR(e.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(e.INST_CODE) = '&&INST_CODE') x WHERE x.RNK <= 10\n    UNION ALL SELECT 3, 'DELTA_SRC', 'PIO_CUSTOMERS_INF_DELTA', TO_CHAR(MAX(e.DAY_DATE),'YYYY-MM-DD'), TO_CHAR(TRUNC(SYSDATE) - TRUNC(MAX(e.DAY_DATE))), TO_CHAR(COUNT(*)), TO_CHAR(SUM(CASE WHEN e.DAY_DATE >= TRUNC(SYSDATE) - 30 THEN 1 ELSE 0 END)), NULL, NULL, NULL, NULL, NULL, NULL FROM PIO_CUSTOMERS_INF_DELTA e WHERE TO_CHAR(e.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(e.INST_CODE) = '&&INST_CODE'\n  ) ORDER BY ORD, C2, C3 DESC)\n WHERE ROWNUM <= 600\nUNION ALL\n-- [DC] Data check: PIO_TRANSACTIONS quality (last 30 days)\nSELECT 'DC' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, X3 AS C3, X4 AS C4, X5 AS C5, X6 AS C6, X7 AS C7, X8 AS C8, X9 AS C9, X10 AS C10, X11 AS C11, NULL AS C12\n  FROM (SELECT C1 AS X1, C2 AS X2, C3 AS X3, C4 AS X4, C5 AS X5, C6 AS X6, C7 AS X7, C8 AS X8, C9 AS X9, C10 AS X10, C11 AS X11\n  FROM (\n    SELECT 1 AS ORD, 'QUAL' AS C1, TO_CHAR(COUNT(*)) AS C2, TO_CHAR(SUM(CASE WHEN TRIM(t.CUS_NUM) IS NULL THEN 1 ELSE 0 END)) AS C3, TO_CHAR(SUM(CASE WHEN TRIM(t.EXPL_CODE) IS NULL THEN 1 ELSE 0 END)) AS C4, TO_CHAR(SUM(CASE WHEN TRIM(t.CAN_REA_CODE) IS NULL THEN 1 ELSE 0 END)) AS C5, TO_CHAR(SUM(CASE WHEN t.EQU_TRA_AMT IS NULL THEN 1 ELSE 0 END)) AS C6, TO_CHAR(SUM(CASE WHEN TRIM(t.DEB_CRE_IND) IS NULL THEN 1 ELSE 0 END)) AS C7, TO_CHAR(SUM(CASE WHEN TRIM(t.BRA_CODE) IS NULL THEN 1 ELSE 0 END)) AS C8, TO_CHAR(MIN(t.DAY_DATE),'YYYY-MM-DD') AS C9, TO_CHAR(MAX(t.DAY_DATE),'YYYY-MM-DD') AS C10, '30' AS C11 FROM PIO_TRANSACTIONS t, (SELECT MAX(x.DAY_DATE) AS MX FROM PIO_TRANSACTIONS x WHERE TO_CHAR(x.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(x.INST_CODE) = '&&INST_CODE') mt WHERE TO_CHAR(t.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(t.INST_CODE) = '&&INST_CODE' AND t.DAY_DATE > mt.MX - 30\n    UNION ALL SELECT 2, 'ORPHAN_CUS', TO_CHAR(COUNT(o.CUS_NUM)), TO_CHAR(COUNT(DISTINCT o.CUS_NUM)), TO_CHAR(MAX(m0.MC),'YYYY-MM-DD'), NULL, NULL, NULL, NULL, NULL, NULL, NULL FROM (SELECT MAX(c2.DAY_DATE) AS MC FROM PIO_CUSTOMERS c2 WHERE TO_CHAR(c2.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(c2.INST_CODE) = '&&INST_CODE') m0 LEFT JOIN (SELECT t.CUS_NUM FROM PIO_TRANSACTIONS t, (SELECT MAX(x.DAY_DATE) AS MX FROM PIO_TRANSACTIONS x WHERE TO_CHAR(x.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(x.INST_CODE) = '&&INST_CODE') mt, (SELECT MAX(c2.DAY_DATE) AS MC FROM PIO_CUSTOMERS c2 WHERE TO_CHAR(c2.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(c2.INST_CODE) = '&&INST_CODE') mc WHERE TO_CHAR(t.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(t.INST_CODE) = '&&INST_CODE' AND t.DAY_DATE > mt.MX - 30 AND TRIM(t.CUS_NUM) IS NOT NULL AND NOT EXISTS (SELECT 1 FROM PIO_CUSTOMERS c WHERE TO_CHAR(c.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(c.INST_CODE) = '&&INST_CODE' AND c.DAY_DATE = mc.MC AND c.CUS_NUM = t.CUS_NUM)) o ON 1 = 1\n    UNION ALL SELECT 3, 'NO_NAMES', TO_CHAR(COUNT(o.CUS_NUM)), TO_CHAR(MAX(m0.CNT)), TO_CHAR(MAX(m0.MC),'YYYY-MM-DD'), NULL, NULL, NULL, NULL, NULL, NULL, NULL FROM (SELECT MAX(c2.DAY_DATE) AS MC, COUNT(*) AS CNT FROM PIO_CUSTOMERS c2, (SELECT MAX(c2.DAY_DATE) AS MC FROM PIO_CUSTOMERS c2 WHERE TO_CHAR(c2.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(c2.INST_CODE) = '&&INST_CODE') mx WHERE TO_CHAR(c2.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(c2.INST_CODE) = '&&INST_CODE' AND c2.DAY_DATE = mx.MC) m0 LEFT JOIN (SELECT c.CUS_NUM FROM PIO_CUSTOMERS c, (SELECT MAX(c2.DAY_DATE) AS MC FROM PIO_CUSTOMERS c2 WHERE TO_CHAR(c2.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(c2.INST_CODE) = '&&INST_CODE') mc WHERE TO_CHAR(c.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(c.INST_CODE) = '&&INST_CODE' AND c.DAY_DATE = mc.MC AND NOT EXISTS (SELECT 1 FROM PIO_CUSTOMERS_NAMES n WHERE TO_CHAR(n.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(n.INST_CODE) = '&&INST_CODE' AND n.CUS_NUM = c.CUS_NUM)) o ON 1 = 1\n  ) ORDER BY ORD)\nUNION ALL\n-- [DO] Data check: transactions whose CUS_NUM is not in PIO_CUSTOMERS (top 50)\nSELECT 'DO' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, X3 AS C3, X4 AS C4, X5 AS C5, NULL AS C6, NULL AS C7, NULL AS C8, NULL AS C9, NULL AS C10, NULL AS C11, NULL AS C12\n  FROM (SELECT TO_CHAR(t.CUS_NUM) AS X1, TO_CHAR(COUNT(*)) AS X2, TO_CHAR(MIN(t.DAY_DATE),'YYYY-MM-DD') AS X3, TO_CHAR(MAX(t.DAY_DATE),'YYYY-MM-DD') AS X4, TO_CHAR(MAX(t.BRA_CODE)) AS X5\n  FROM PIO_TRANSACTIONS t, (SELECT MAX(x.DAY_DATE) AS MX FROM PIO_TRANSACTIONS x WHERE TO_CHAR(x.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(x.INST_CODE) = '&&INST_CODE') mt, (SELECT MAX(c2.DAY_DATE) AS MC FROM PIO_CUSTOMERS c2 WHERE TO_CHAR(c2.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(c2.INST_CODE) = '&&INST_CODE') mc\n  WHERE TO_CHAR(t.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(t.INST_CODE) = '&&INST_CODE' AND t.DAY_DATE > mt.MX - 30 AND TRIM(t.CUS_NUM) IS NOT NULL\n    AND NOT EXISTS (SELECT 1 FROM PIO_CUSTOMERS c WHERE TO_CHAR(c.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(c.INST_CODE) = '&&INST_CODE' AND c.DAY_DATE = mc.MC AND c.CUS_NUM = t.CUS_NUM)\n  GROUP BY t.CUS_NUM\n  ORDER BY COUNT(*) DESC)\n WHERE ROWNUM <= 50\nUNION ALL\n-- [SN] Data check: snapshot dates vs MAX(DAY_DATE) of PIO_TRANSACTIONS\nSELECT 'SN' AS CHECK_ID, ROWNUM AS RN, X1 AS C1, X2 AS C2, X3 AS C3, X4 AS C4, NULL AS C5, NULL AS C6, NULL AS C7, NULL AS C8, NULL AS C9, NULL AS C10, NULL AS C11, NULL AS C12\n  FROM (SELECT C1 AS X1, C2 AS X2, C3 AS X3, C4 AS X4\n  FROM (\n    SELECT 1 AS ORD, 'PIO_TRANSACTIONS' AS C1, TO_CHAR(MAX(t.DAY_DATE),'YYYY-MM-DD') AS C2, NULL AS C3, NULL AS C4 FROM PIO_TRANSACTIONS t WHERE TO_CHAR(t.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(t.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 2, 'PIO_SNAP_DATE', TO_CHAR(MAX(p.LAST_FILL_DATE),'YYYY-MM-DD'), TO_CHAR(MAX(p.PREV_FILL_DATE),'YYYY-MM-DD'), NULL FROM PIO_SNAP_DATE p WHERE TO_CHAR(p.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(p.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 3, 'PIO_CUSTOMERS', TO_CHAR(MAX(m.DAY_DATE),'YYYY-MM-DD'), TO_CHAR(COUNT(DISTINCT m.DAY_DATE)), NULL FROM PIO_CUSTOMERS m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 4, 'PIO_LEDGERS', TO_CHAR(MAX(m.DAY_DATE),'YYYY-MM-DD'), TO_CHAR(COUNT(DISTINCT m.DAY_DATE)), NULL FROM PIO_LEDGERS m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 5, 'PIO_BRANCHES', TO_CHAR(MAX(m.DAY_DATE),'YYYY-MM-DD'), TO_CHAR(COUNT(DISTINCT m.DAY_DATE)), NULL FROM PIO_BRANCHES m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 6, 'PIO_CURRENCIES', TO_CHAR(MAX(m.DAY_DATE),'YYYY-MM-DD'), TO_CHAR(COUNT(DISTINCT m.DAY_DATE)), NULL FROM PIO_CURRENCIES m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 7, 'PIO_TMPTRANSACTIONS', TO_CHAR(MAX(m.DAY_DATE),'YYYY-MM-DD'), NULL, NULL FROM PIO_TMPTRANSACTIONS m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 8, 'PIO_CUSTOMERS_TMP', TO_CHAR(MAX(m.DAY_DATE),'YYYY-MM-DD'), NULL, NULL FROM PIO_CUSTOMERS_TMP m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n    UNION ALL SELECT 9, 'PIO_CUSTOMERS_NAMES', TO_CHAR(MAX(m.DATE_OPEN),'YYYY-MM-DD'), TO_CHAR(COUNT(*)), NULL FROM PIO_CUSTOMERS_NAMES m WHERE TO_CHAR(m.COUNTRY_CODE) = '&&COUNTRY_CODE' AND TO_CHAR(m.INST_CODE) = '&&INST_CODE'\n  ) ORDER BY ORD)\nORDER BY 1, 2;\n";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ------------------------------------------------------------------ parsing */
function normalizeRows(aoa){
  let h = -1, idx = {};
  for (let i=0;i<Math.min(aoa.length,15);i++){ const row = (aoa[i]||[]).map(x => String(x ?? "").trim().toUpperCase()); if (row.includes("CHECK_ID")) { h = i; row.forEach((c,j)=> idx[c]=j); break; } }
  if (h < 0) return null;
  const out = {};
  for (let i=h+1;i<aoa.length;i++){ const r = aoa[i]; if(!r) continue; const id = String(r[idx.CHECK_ID] ?? "").trim(); if(!id) continue;
    const vals = []; for (let c=1;c<=12;c++){ const j = idx["C"+c]; let v = j===undefined ? "" : r[j]; if (v instanceof Date) v = v.toISOString().slice(0,10); vals.push(v===null||v===undefined ? "" : String(v).trim()); }
    (out[id] = out[id] || []).push({rn: num(r[idx.RN]) ?? i, vals}); }
  const res = {}; Object.keys(out).forEach(k => res[k] = out[k].sort((a,b)=>a.rn-b.rn).map(x=>x.vals)); return res;
}
function parseWorkbook(wb){ let m = {}; wb.SheetNames.forEach(n => { const r = normalizeRows(XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:false, defval:""})); if (r) m = {...m, ...r}; }); return m; }
async function loadFiles(files){
  const msg = $("#loadmsg");
  if (typeof XLSX === "undefined"){ msg.textContent = "تعذّر تحميل مكتبة قراءة Excel. تحقق من الاتصال ثم أعد فتح الصفحة."; msg.className="msg err"; return; }
  let merged = {}, names = [];
  for (const f of files){ try{ const wb = XLSX.read(await f.arrayBuffer(), {type:"array", cellDates:true}); const r = parseWorkbook(wb); if (Object.keys(r).length){ merged = {...merged, ...r}; names.push(f.name); } }catch(e){ console.error(e); } }
  applyData(merged, names, msg);
}
function loadPaste(){ const t = $("#paste").value, msg = $("#loadmsg"); if (!t.trim()){ msg.textContent = "الصق نتائج الاستعلام أولاً."; msg.className="msg err"; return; } applyData(parseWorkbook(XLSX.read(t, {type:"string", raw:true})), ["pasted"], msg); }
function applyData(merged, names, msg){
  const n = Object.keys(merged).length;
  if (!n){ msg.textContent = "لم أجد عمود CHECK_ID في الملف. تأكد أنك صدّرت النتيجة مع أسماء الأعمدة."; msg.className="msg err"; return; }
  const REQ = ["K0","SC","ST","SP","SS","DC","SN"];
  const miss = REQ.filter(x=>!merged[x]);
  if (miss.length){ msg.className = "msg err"; msg.innerHTML = `الملف ناقص ولم يتم تحميله. الأجزاء الناقصة: <b dir="ltr">${miss.join(", ")}</b>.<br>السبب غالباً أن Toad لم يجلب كل الصفوف: بعد F9 اضغط داخل الشبكة ثم <kbd>Ctrl</kbd>+<kbd>End</kbd> حتى يجلب كل الصفوف قبل النسخ، أو استخدم <b>Export Dataset</b> لكل الصفوف. وتأكد أنك تستخدم آخر نسخة من السكربت.`; return; }
  DATA = merged; META = {source:names.join(" + "), sample:false};
  try{ localStorage.setItem("amlsa.data", JSON.stringify({DATA, META})); }catch(e){}
  current = "main"; selScen = "ALL"; let hOk = false; try{ hOk = histAdd(); }catch(e){ console.error(e); } if (!hOk) HIST_ERR = true; render();
}

/* ------------------------------------------------------------------ model */
function model(){
  const meta = {}; R("SC").forEach(r => meta[r[0]] = {code:r[0], en:r[1], ar:r[2], cat:r[3], active:isY(r[4]), run:isY(r[5]), viol:r[6], wl:isY(r[7]), rules:num(r[8])||0, pmin:num(r[9]), pmax:num(r[10]), upd:r[11]});
  const sc = {};
  const get = c => sc[c] = sc[c] || {code:c, steps:{}, total:0, n30:0, open:0, openOld:0, oldestOpen:null, last:null, first:null};
  R("ST").forEach(r => { const s = get(r[0]); const st = {n:num(r[2])||0, min:r[3], max:r[4], avg:num(r[5]), maxAge:num(r[6]), n30:num(r[7])||0, gt30:num(r[8])||0};
    s.steps[r[1]] = st; s.total += st.n; s.n30 += st.n30;
    if (stepOf(r[1]).open){ s.open += st.n; s.openOld += st.gt30; s.oldestOpen = Math.max(s.oldestOpen ?? 0, st.maxAge ?? 0); }
    if (!s.last || st.max > s.last) s.last = st.max; if (!s.first || st.min < s.first) s.first = st.min; });
  Object.keys(meta).forEach(c => get(c));
  const tm = {}; R("TM").forEach(r => tm[r[0]] = {n:num(r[1]), days:num(r[2]), first:r[3], last:r[4], since:num(r[5]), lag:num(r[6]), lagMax:num(r[7]), cust:num(r[8]), n90:num(r[9])});
  const list = Object.values(sc).map(s => ({...s, meta: meta[s.code] || {code:s.code, en:"", ar:"", active:null}, tm: tm[s.code] || null, sys: SYS_SCEN.includes(s.code)}));
  const steps = {}; list.forEach(s => Object.entries(s.steps).forEach(([k,v]) => { const t = steps[k] = steps[k] || {n:0, gt30:0, ageSum:0, maxAge:0, n30:0}; t.n += v.n; t.gt30 += v.gt30; t.ageSum += (v.avg||0)*v.n; t.maxAge = Math.max(t.maxAge, v.maxAge||0); t.n30 += v.n30; }));
  // silence for name-screening families: 888888 is not silent if 8888888 (same family) is still alerting
  const famMin = {}; list.forEach(s=>{ if (isNSCode(s.code) && s.tm && s.tm.since!=null){ const k = nsBase(s.code); famMin[k] = Math.min(famMin[k]??Infinity, s.tm.since); } });
  list.forEach(s=>{ s.silSince = s.tm ? (isNSCode(s.code) && famMin[nsBase(s.code)]!=null ? famMin[nsBase(s.code)] : s.tm.since) : null; });
  const total = list.reduce((a,s)=>a+s.total,0);
  return {list, steps, total, meta};
}

/* ------------------------------------------------------------------ findings */
function F(id, ar, en, status, value, detail){ return {id, ar, en, status, value, detail}; }
/* ------------------------------------------------------------------ check classification (configurable in Score settings) */
const REG = {};
const normKey = t => String(t||"").replace(/[0-9][0-9,.:%\-\/]*/g,"#").replace(/\s+/g," ").trim();
const PROBLEM = st => st==="warn" || st==="fail";
function chk(key, st, area, grp, label, raw){
  if (!key) return st;
  if (!REG[key]) REG[key] = {area, grp, label: normKey(label), def: null};
  const r0 = raw===undefined ? st : raw; if (PROBLEM(r0) || r0==="info") REG[key].def = REG[key].def==="fail"||r0===REG[key].def ? REG[key].def : (r0==="fail"?"fail":REG[key].def==="warn"?"warn":r0);
  const c = cfgLoad().sev?.[key], r = raw===undefined ? st : raw;
  return c && PROBLEM(r) ? c : st;
}
function findings(M){
  const out = [], rd = runDate();
  const act = M.list.filter(s => s.meta.active && !s.sys);
  const never = act.filter(s => s.total === 0);
  out.push(F("never","سيناريوهات فعّالة لم تولّد أي تنبيه","Active scenarios with no alerts ever", never.length?"info":"ok", `${never.length} / ${act.length}`, never.length ? never.slice(0,6).map(s=>s.code).join("، ") + (never.length>6?"…":"") : "كل السيناريوهات الفعّالة ولّدت تنبيهات"));
  const silent = act.filter(s => s.total>0 && s.tm && s.silSince > Math.max(60, 2*(s.meta.pmax||0)));
  out.push(F("silent","سيناريوهات توقفت عن التوليد","Active scenarios gone silent", silent.length?"warn":"ok", `${silent.length}`, silent.length ? silent.slice(0,5).map(s=>`${s.code} (${s.tm.since} يوم)`).join("، ") : "آخر تنبيه لكل سيناريو ضمن الفترة المتوقعة (60 يوماً أو ضعف فترة القاعدة)"));
  const ghost = M.list.filter(s => s.meta.active === false && s.n30 > 0);
  out.push(F("ghost","سيناريوهات غير فعّالة ولّدت تنبيهات (30 يوم)","Inactive scenarios still alerting", ghost.length?"warn":"ok", `${ghost.length}`, ghost.length ? ghost.map(s=>s.code).join("، ") : "لا يوجد"));
  const open = STEP_KEYS.filter(k=>STEPS[k].open).reduce((a,k)=>a+(M.steps[k]?.n||0),0), old = STEP_KEYS.filter(k=>STEPS[k].open).reduce((a,k)=>a+(M.steps[k]?.gt30||0),0);
  const p = open ? 100*old/open : 0;
  out.push(F("aging","تنبيهات في سير العمل أقدم من 30 يوماً","Open workflow alerts older than 30 days", old===0?"ok":"info", `${fmt(old)} / ${fmt(open)}`, `${fmt(p,1)}% من التنبيهات في الخطوات 1 و2 و3 و5`));
  const newOld = M.steps["1"]?.gt30 || 0;
  out.push(F("new","تنبيهات جديدة لم يفتحها أحد منذ أكثر من 30 يوماً","New alerts untouched > 30 days", newOld?"info":"ok", fmt(newOld), "الخطوة 1 · جديد"));
  const re = M.steps["5"]?.n || 0, processed = ["3","4","5","6"].reduce((a,k)=>a+(M.steps[k]?.n||0),0);
  const rp = processed ? 100*re/processed : 0;
  out.push(F("reinv","نسبة إعادة التحقيق","Re-investigation rate", processed? (rp<=10?"ok":"warn") : "na", `${fmt(rp,1)}%`, `${fmt(re)} تنبيه أُعيد من المستوى 2 إلى 1 من أصل ${fmt(processed)} وصلت مرحلة الموافقة أو بعدها`));
  const undef = Object.keys(M.steps).filter(k => !STEPS[k]);
  if (undef.length) out.push(F("undef","خطوات غير معرّفة في CURRENT_STEP","Undefined CURRENT_STEP codes","warn", undef.join(", "), `${fmt(undef.reduce((a,k)=>a+M.steps[k].n,0))} تنبيه بقيمة خارج 1–6`));
  const late = M.list.filter(s => s.tm && s.tm.lag !== null && s.tm.lag > 1);
  out.push(F("lag","تأخر توليد التنبيه عن تاريخ العمل","Alert creation lag > 1 day", late.length?"warn":(M.list.some(s=>s.tm&&s.tm.lag!==null)?"ok":"na"), `${late.length}`, late.length ? late.slice(0,5).map(s=>`${s.code} (${fmt(s.tm.lag,1)} يوم)`).join("، ") : "متوسط الفرق بين CREATION_DATE و DAY_DATE ضمن يوم"));
  const t30 = M.list.reduce((a,s)=>a+s.n30,0), top = [...M.list].sort((a,b)=>b.n30-a.n30)[0];
  if (t30 && top) { const sh = 100*top.n30/t30; out.push(F("conc","تركّز التنبيهات في سيناريو واحد (30 يوم)","Alert concentration (30 days)", sh>50?"warn":"info", `${fmt(sh,1)}%`, `${top.code} ${top.meta.en||""} · قد يحتاج ضبط العتبات إن كانت نتائجه غالباً سليمة`)); }
  out.forEach(f=>{ f.status = chk("f:"+f.id, f.status, "alerts", "ملاحظات تلقائية", f.ar, f.status==="info" && ["never","aging","new"].includes(f.id) ? "warn" : f.status); });
  return out;
}

/* ------------------------------------------------------------------ UI pieces */

/* ------------------------------------------------------------------ drill-down */
let openDrill = {};
const nmA = s => s.meta.ar || "", nmE = s => s.meta.en || (s.meta.active===null ? "غير موجود في جدول السيناريوهات · not in scenario master" : "");
const SCOL = [["السيناريو","Scenario"],["الاسم","Name (AR)"],["Name","Name (EN)"]];
const sRow = s => [s.code, nmA(s), nmE(s)];
function drillFor(f, M){
  const rd = runDate(), act = M.list.filter(s => s.meta.active && !s.sys);
  const age = d => { const x = toDate(d); return x ? daysBetween(x, rd) : null; };
  const openSteps = STEP_KEYS.filter(k=>STEPS[k].open).concat(Object.keys(M.steps).filter(k=>!STEPS[k]));
  if (f.drill) return f.drill;
  switch(f.id){
    case "never": { const L = act.filter(s=>s.total===0).sort((a,b)=>a.code.localeCompare(b.code));
      return {note:"سيناريوهات ACTIVE_FLAG = 1 وليس لها أي سجل في PIO_AML_CUSTOMERS لهذه الدولة. راجع RUN_FLAG وعدد القواعد والعتبات، وتأكد أن المحرك يشغّلها.",
        cols:[...SCOL,["التصنيف","Category"],["RUN_FLAG","Run"],["عدد القواعد","Rules"],["فترة القاعدة (يوم)","Rule period"],["مستوى المخالفة","Violation lvl"],["Watchlist","WL"],["آخر تعديل","Updated"],["الملاحظة","Hint"]],
        rows:L.map(s=>[...sRow(s), s.meta.cat||"", s.meta.run?"1":"0", s.meta.rules, s.meta.pmin===null?"—":(s.meta.pmin===s.meta.pmax?s.meta.pmin:`${s.meta.pmin}–${s.meta.pmax}`), s.meta.viol||"", s.meta.wl?"1":"0", s.meta.upd||"",
          !s.meta.run ? "RUN_FLAG مطفأ" : !s.meta.rules ? "لا توجد قواعد مربوطة" : "تحقق من العتبات / سجل المحرك"])}; }
    case "silent": { const L = act.filter(s => s.total>0 && s.tm && s.silSince > Math.max(60, 2*(s.meta.pmax||0))).sort((a,b)=>b.tm.since-a.tm.since);
      return {note:"سيناريوهات فعّالة ولّدت تنبيهات سابقاً لكن آخر تنبيه أقدم من 60 يوماً أو من ضعف فترة القاعدة. تحقق من تشغيل المحرك اليومي (PIO_AML_ENGINE_LOG) وتغيّر العتبات.",
        cols:[...SCOL,["التنبيهات","Alerts"],["أيام نشطة","Active days"],["أول تنبيه","First"],["آخر تنبيه","Last"],["منذ (يوم)","Days since"],["الحد المتوقع","Expected ≤"],["فترة القاعدة","Rule period"],["مفتوح","Open"],["عملاء","Customers"]],
        rows:L.map(s=>[...sRow(s), s.total, s.tm.days, s.tm.first, s.tm.last, s.tm.since, Math.max(60, 2*(s.meta.pmax||0)), s.meta.pmax??"—", s.open, s.tm.cust])}; }
    case "ghost": { const L = M.list.filter(s => s.meta.active === false && s.n30 > 0);
      return {note:"سيناريوهات ACTIVE_FLAG ≠ 1 ومع ذلك ولّدت تنبيهات خلال آخر 30 يوماً.",
        cols:[...SCOL,["آخر 30 يوم","30d"],["المجموع","Total"],["آخر تنبيه","Last"],["RUN_FLAG","Run"]],
        rows:L.map(s=>[...sRow(s), s.n30, s.total, s.last, s.meta.run?"1":"0"])}; }
    case "aging": { const rows = [];
      M.list.forEach(s => openSteps.forEach(k => { const st = s.steps[k]; if (st && st.n) rows.push([...sRow(s), `${k} · ${stepOf(k).ar}`, st.n, st.gt30, st.min, st.max, fmt(st.avg,0), st.maxAge]); }));
      rows.sort((a,b)=>b[5]-a[5]);
      return {note:"كل تنبيه مفتوح (الخطوات 1، 2، 3، 5 وأي خطوة غير معرّفة) موزّع حسب السيناريو والخطوة، مرتب حسب عدد التنبيهات الأقدم من 30 يوماً.",
        cols:[...SCOL,["الخطوة","Step"],["العدد","Count"],["> 30 يوم","> 30d"],["أقدم تاريخ","Oldest"],["أحدث تاريخ","Newest"],["متوسط العمر","Avg age"],["أقصى عمر","Max age"]], rows}; }
    case "new": { const L = M.list.filter(s=>s.steps["1"]?.n).sort((a,b)=>b.steps["1"].gt30-a.steps["1"].gt30);
      return {note:"تنبيهات CURRENT_STEP = 1 (جديد) لم يبدأ أحد العمل عليها. إن كانت كبيرة وقديمة فغالباً لم تُوزّع على المحققين أو أن سير العمل لا يُستخدم.",
        cols:[...SCOL,["العدد","Count"],["> 30 يوم","> 30d"],["آخر 30 يوم","30d"],["أقدم تاريخ","Oldest"],["أحدث تاريخ","Newest"],["متوسط العمر","Avg age"],["أقصى عمر","Max age"],["% من الجديد","% of new"]],
        rows:L.map(s=>{const st=s.steps["1"]; return [...sRow(s), st.n, st.gt30, st.n30, st.min, st.max, fmt(st.avg,0), st.maxAge, fmt(100*st.n/(M.steps["1"]?.n||1),1)+"%"];})}; }
    case "reinv": { const L = M.list.filter(s=>["3","4","5","6"].some(k=>s.steps[k]?.n));
      return {note:"نسبة التنبيهات المعادة من المستوى 2 إلى المستوى 1 (الخطوة 5) من التنبيهات التي وصلت مرحلة الموافقة أو بعدها، لكل سيناريو.",
        cols:[...SCOL,["3 بانتظار الموافقة","Step 3"],["4 موافقة","Step 4"],["5 إعادة تحقيق","Step 5"],["6 مخالفات","Step 6"],["نسبة الإعادة","Re-inv %"]],
        rows:L.map(s=>{const g=k=>s.steps[k]?.n||0, p=g("3")+g("4")+g("5")+g("6"); return [...sRow(s), g("3"), g("4"), g("5"), g("6"), fmt(p?100*g("5")/p:0,1)+"%"];})}; }
    case "undef": { const rows = [];
      M.list.forEach(s => Object.entries(s.steps).forEach(([k,st]) => { if (!STEPS[k]) rows.push([...sRow(s), k, st.n, st.min, st.max, st.maxAge]); }));
      return {note:"قيم CURRENT_STEP خارج 1–6. تحقق من تعريف خطوات سير العمل (PIO_WORKFLOW_STATUS_INSTANCE) أو من تعديل يدوي على البيانات. استعلام للتفاصيل: SELECT * FROM PIO_AML_CUSTOMERS WHERE CURRENT_STEP NOT IN ('1','2','3','4','5','6');",
        cols:[...SCOL,["الخطوة","Step code"],["العدد","Count"],["أقدم تاريخ","Oldest"],["أحدث تاريخ","Newest"],["أقصى عمر","Max age"]], rows}; }
    case "lag": { const L = M.list.filter(s=>s.tm && s.tm.lag!==null).sort((a,b)=>b.tm.lag-a.tm.lag);

        cols:[...SCOL,["متوسط التأخر","Avg lag (d)"],["أقصى تأخر","Max lag (d)"],["التنبيهات","Alerts"],["أول تنبيه","First"],["آخر تنبيه","Last"],["الحالة","Status"]],
        rows:L.map(s=>[...sRow(s), fmt(s.tm.lag,2), fmt(s.tm.lagMax,2), s.tm.n, s.tm.first, s.tm.last, s.tm.lag>1?"متأخر":"سليم"])}; }
    case "conc": { const t30 = M.list.reduce((a,s)=>a+s.n30,0); const L = M.list.filter(s=>s.n30).sort((a,b)=>b.n30-a.n30);
      return {note:"توزيع تنبيهات آخر 30 يوماً على السيناريوهات.", cols:[...SCOL,["آخر 30 يوم","30d"],["النسبة","Share"],["المجموع","Total"]],
        rows:L.map(s=>[...sRow(s), s.n30, fmt(100*s.n30/t30,1)+"%", s.total])}; }
  }

}

function vbars(cats, series, opts={}){
