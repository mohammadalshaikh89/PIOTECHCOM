function stacked(cats, series, opts={}){
  if (!cats.length) return `<div class="empty">لا توجد بيانات للرسم.</div>`;
  const W = 720, H = opts.h || 240, pl = 46, pr = 8, pt = 10, pb = 28;
  const tot = cats.map((_,i)=>series.reduce((a,s)=>a+(s.values[i]||0),0));
  const nice = niceMax(Math.max(1,...tot)), iw = W-pl-pr, ih = H-pt-pb, gw = iw/cats.length, bw = Math.max(3, Math.min(34, gw-6));
  let g = "";
  for (let t=0;t<=4;t++){ const v = nice*t/4, y = pt+ih-ih*v/nice; g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${short(v)}</text>`; }
  const every = Math.ceil(cats.length / 12);
  cats.forEach((c,i)=>{ let y = pt+ih; const x = pl + gw*i + (gw-bw)/2;
    series.forEach(s=>{ const v = s.values[i]||0; if(!v) return; const h = ih*v/nice; y -= h; g += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,h-1)}" fill="${s.color}"/>`; });
    g += `<rect x="${pl+gw*i}" y="${pt}" width="${gw}" height="${ih}" fill="transparent" data-tip="${esc(c)} · ${fmt(tot[i])}\n${series.filter(s=>s.values[i]).map(s=>`${s.name}: ${fmt(s.values[i])}`).join("\n")}"/>`;
    if (i % every === 0) g += `<text x="${pl+gw*i+gw/2}" y="${H-10}" text-anchor="middle">${esc(opts.label?opts.label(c):c)}</text>`; });
  g += `<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--axis)"/>`;
  return `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;
}

async function saveXlsx(sheets, tag, msg){

  const wb = XLSX.utils.book_new();
  Object.entries(sheets).forEach(([n,rows])=>{ const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = rows[0].map((_,c)=>({wch: Math.min(60, Math.max(10, ...rows.map(r=>String(r[c]??"").length+2)))})); XLSX.utils.book_append_sheet(wb, ws, n); });
  const k = K(), name = `AML_${tag}_${(k.BANK_NAME||"Bank").replace(/[^\w؀-ۿ]+/g,"_")}_${(k.RUN_TS||"").slice(0,10)}.xlsx`;
  const buf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
  const dl = window.claude?.use ? await window.claude.use("downloads") : null;
  if (dl){ try{ await dl.save({filename:name, data:new Blob([buf])}); msg.textContent = "تم التصدير"; }catch(e){ msg.textContent = e?.code==="declined" ? "" : "تعذّر التصدير"; } }

function scoreOf(L){
  const W = getW(), P = getP();
  const areas = Object.keys(W).map(t=>{ const x = L.filter(i=>PAGE_TAB[i.tab]===t);
    let pen = 0; x.forEach(i=>{ const per = i.tab==="scen" ? (i.st==="fail"?P.sfail:P.swarn) : (i.st==="fail"?P.fail:P.warn); pen += per; });
    const sc = Math.max(0, 100 - pen); return {t, w:W[t], sc, fail:x.filter(i=>i.st==="fail").length, warn:x.filter(i=>i.st==="warn").length}; });
  const tw = areas.reduce((a,x)=>a+x.w, 0); const total = tw ? Math.round(areas.reduce((a,x)=>a + x.sc*x.w, 0) / tw) : 0;
  const grade = total>=85 ? ["ok","ممتاز","Excellent"] : total>=70 ? ["ok","جيد","Good"] : total>=50 ? ["warn","يحتاج تحسين","Needs improvement"] : ["fail","ضعيف","Poor"];
  return {total, grade, areas};
}

  const d = (a,b) => b===undefined||b===null ? "" : a===b ? ` <small class="muted">=</small>` : ` <small style="color:${a>b?"var(--fail-ink)":"var(--ok)"}">${a>b?"▲":"▼"}${fmt(Math.abs(a-b))}</small>`;
  const rows = H.map((h,i)=>{ const p = prevOf(h,i); return `<tr><td class="code">${esc(h.run||"—")}</td><td class="nm">${esc(h.bank||"—")}</td><td class="code">${esc(h.country)} / ${esc(h.inst)}</td><td class="code">${esc(h.db)}</td><td class="n"><b>${h.score??"—"}</b>${h.score!=null&&p?.score!=null ? (h.score===p.score ? ` <small class="muted">=</small>` : ` <small style="color:${h.score>p.score?"var(--ok)":"var(--fail-ink)"}">${h.score>p.score?"▲":"▼"}${Math.abs(h.score-p.score)}</small>`) : ""}</td><td class="n"><b style="color:var(--fail-ink)">${fmt(h.fail)}</b>${d(h.fail,p?.fail)}</td><td class="n"><b>${fmt(h.warn)}</b>${d(h.warn,p?.warn)}</td><td class="n">${fmt(h.alerts)}</td><td class="code">${esc(h.saved)}</td>

  const k0 = K(), inH = H.some(h=>h.run===(k0.RUN_TS||"") && h.db===(k0.DB_NAME||"") && h.country===(k0.COUNTRY_CODE||"") && h.inst===(k0.INST_CODE||""));

    ${panel(`الفحوصات المحفوظة · ${H.length}`, "Saved runs", H.length ? `<div class="tbl" style="max-height:none"><table class="ovt"><thead><tr><th>وقت التشغيل<small>Run</small></th><th>البنك<small>Bank</small></th><th>الدولة / المؤسسة<small>Country / Inst</small></th><th>القاعدة<small>DB</small></th><th>السكور<small>Score</small></th><th>خلل<small>Fail</small></th><th>مراجعة<small>Review</small></th><th>التنبيهات<small>Alerts</small></th><th>تاريخ الحفظ<small>Saved</small></th><th></th></tr></thead><tbody>${rows}</tbody></table></div><p class="lead" style="font-size:12px;margin-top:8px">▲ / ▼ = الفرق عن آخر فحص لنفس البنك والدولة والمؤسسة.</p>` : `<div class="empty">${META.sample ? "البيانات المعروضة حالياً تجريبية ولا تُحفظ في السجل. حمّل ملف نتائج حقيقي من «تحميل النتائج» ليُحفظ هنا تلقائياً." : "لا توجد فحوصات محفوظة بعد. حمّل نتائج من «تحميل النتائج»."}</div>`)}

function tr(s){
  if (LANG!=="en" || !s || !ARRE.test(s)) return s;

function trNode(root){

function arClean(root){
  if (LANG!=="ar" || !root || root.nodeType!==1) return;
  root.querySelectorAll("small").forEach(sm=>{ const t = sm.textContent.trim(); if (!t || ARRE.test(t) || !/[A-Za-z]/.test(t)) return;

async function exportXlsx(only, msgId, tag){

  const all = exportRows(), data = only ? Object.fromEntries(only.map(n=>[n, all[n]])) : all, wb = XLSX.utils.book_new();
  Object.entries(data).forEach(([n,rows])=>{ const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = rows[0].map((_,c)=>({wch: Math.min(40, Math.max(10, ...rows.map(r=>String(r[c]??"").length+2)))})); if (rows.length>1) ws["!autofilter"] = {ref: XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:rows[0].length-1}})}; XLSX.utils.book_append_sheet(wb, ws, n); });

  const buf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
  const dl = window.claude?.use ? await window.claude.use("downloads") : null;
  if (dl){ try{ await dl.save({filename:name, data:new Blob([buf])}); msg.textContent = "تم التصدير"; }catch(e){ msg.textContent = e?.code==="declined" ? "" : "تعذّر التصدير"; } }

  D.SN = [["PIO_TRANSACTIONS",ds(1)],["PIO_SNAP_DATE",ds(1),ds(2)],["PIO_CUSTOMERS",ds(1),"30"],["PIO_LEDGERS",ds(1),"30"],["PIO_BRANCHES",ds(4),"30"],["PIO_CURRENCIES",ds(1),"30"],["PIO_TMPTRANSACTIONS",ds(1)],["PIO_CUSTOMERS_TMP",ds(6)],["PIO_CUSTOMERS_NAMES",ds(3),"151880"]].map(pad);
  D.DC = [["QUAL","1845230","0","312","1790110","0","0","14",ds(30),ds(1),"30"],["ORPHAN_CUS","2140","37",ds(1)],["NO_NAMES","460","152340",ds(1)]].map(pad);
  D.DO = [["90012345","820",ds(29),ds(1),"001"],["90077881","410",ds(25),ds(2),"014"],["80000312","96",ds(18),ds(3),"002"]].map(pad);
  D.SP.push(pad(["AML_SCRENING","BULK_DELTA_CUSTOMERS","API Bulk Delta Customers","USED","1","","PIO_API_GENERAL_SCREEN_CONFIG"]),pad(["AML_SCRENING","BULK_ALL_CUSTOMERS","API Bulk All Customers","USED","1","","PIO_API_GENERAL_SCREEN_CONFIG"]),pad(["AML_SCRENING","BULK_NEW_CUSTOMERS","API Bulk New Customers","NOT USED","0","","PIO_API_GENERAL_SCREEN_CONFIG"]),pad(["AML_SCRENING","INSERT_MANUAL","Manual Insert","USED","1","","PIO_API_GENERAL_SCREEN_CONFIG"]));
  DATA = D; META = {source:"sample", sample:true};
}

const AREA_INFO = [
  ["site","إعدادات الموقع","يراجع محددات الموقع ومحرك AML وسير العمل والفحص، ويكشف المعاملات غير المعرّفة أو المتوقفة.","site"],
  ["dc","سحب البيانات وجودتها","يتأكد أن بيانات العملاء والحركات والفروع سُحبت حتى آخر يوم عمل، ويقيس جودة الحقول الأساسية.","dc"],
  ["alerts","السيناريوهات والتنبيهات","يدرس كل سيناريو فعّال: التنبيهات التي ولّدها، آخر تاريخ، السيناريوهات الصامتة، ومراحل سير العمل.","alerts"],
  ["ns","فحص الأسماء","يراجع قوائم الحظر المفعّلة والمحمّلة، جدولة الفحص وآخر تشغيل فعلي، وواجهة API.","ns"],
];
function viewHome(){
  const ring = `<svg viewBox="0 0 160 160" class="h360" aria-hidden="true"><circle cx="80" cy="80" r="66" fill="none" stroke="var(--accent-soft)" stroke-width="14"/><circle cx="80" cy="80" r="66" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="300 115" transform="rotate(-90 80 80)"/><circle cx="80" cy="80" r="66" fill="none" stroke="var(--brand2)" stroke-width="14" stroke-linecap="round" stroke-dasharray="60 355" stroke-dashoffset="-330" transform="rotate(-90 80 80)"/><text x="80" y="78" text-anchor="middle" class="t1">360</text><text x="80" y="104" text-anchor="middle" class="t2">AML</text></svg>`;
  const has0 = Object.keys(DATA).length, k = K();
  const cards = AREA_INFO.map(([id,t,d,go],i)=>`<button class="hcard" data-go="${go}"><span class="hic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${NAV_ICON[id]||""}</svg></span><span class="hn">0${i+1}</span><b>${t}</b><span class="hd">${d}</span><span class="hgo">فتح ←</span></button>`).join("");
  const steps = [["load","تشغيل السكريبت","شغّل AML_SA_Extract.sql في Toad على BI_DWH وصدّر النتيجة."],["load","تحميل النتائج","حمّل ملف Excel أو CSV، ويُقرأ داخل المتصفح فقط."],["report","التقرير النهائي","سكور من 100 حسب القسم، وتنزيل التقرير PDF."]];
  return `<section class="view home">
    <div class="panel hhero">${ring}<div class="hh">
      <div class="hk">PIO-TECH · BANKBI</div><h1>AML 360</h1><div class="hs">الفحص الشامل لنظام AML</div>
      <p>أداة لفحص سلامة تطبيق PIO AML لدى البنك بعد التشغيل: تقرأ نتائج سكريبت واحد من قاعدة البيانات، وتفحص الإعدادات وسحب البيانات والسيناريوهات وفحص الأسماء، ثم تعطي سكوراً من 100 وتقريراً نهائياً.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:14px"><button class="primary" data-go="${has0?"report":"load"}">${has0?"عرض التقرير النهائي":"تحميل النتائج"}</button>${has0?`<button data-go="main">المعلومات الرئيسية · ${esc(k.BANK_NAME||"")}</button>`:`<button id="homeSample">استعراض البيانات التجريبية</button>`}</div>
    </div></div>
    ${has0 ? `<h3 class="hsec">ماذا يفحص AML 360</h3>
    <div class="hgrid">${cards}</div>` : ""}
    <h3 class="hsec">كيف يعمل</h3>
    <div class="hsteps">${steps.map(([g,t,d],i)=>`<button class="hstep" data-go="${g}"><span class="hsn">${i+1}</span><span><b>${t}</b><span class="hd">${d}</span></span></button>`).join("")}</div>
  </section>`;
}
/* ------------------------------------------------------------------ login (client-side gate, stored in this browser) */
const LOGIN_KEY = "amlsa.loginpwd", AUTH_KEY = "amlsa.auth";
const authed = () => { if (SB_ON()) return !!SB_SES?.at; try{ return sessionStorage.getItem(AUTH_KEY)==="1"; }catch(e){ return !!window.__auth; } };
function setAuth(v){ window.__auth = v; try{ v ? sessionStorage.setItem(AUTH_KEY,"1") : sessionStorage.removeItem(AUTH_KEY); }catch(e){} }
function loginGet(){ try{ return localStorage.getItem(LOGIN_KEY); }catch(e){ return null; } }
function showLogin(msg){
  const en = LANG==="en", L2 = (a,b)=> en?b:a, sbm = SB_ON(), has = sbm || !!loginGet(), conf = sbConf();
  document.getElementById("app").hidden = true;
  let el = document.getElementById("login"); if (!el){ el = document.createElement("div"); el.id = "login"; document.body.appendChild(el); }
  el.hidden = false; el.dir = en ? "ltr" : "rtl";
  const host = conf ? conf.url.replace(/^https?:\/\//,"").replace(/\/.*$/,"") : "";
  el.innerHTML = `<div class="lgbox">
    <div class="lgtop"><span class="logo" role="img" aria-label="PIO-TECH"></span><span class="pio">BANKBI</span><span style="flex:1"></span><button class="lglang" data-lg="${en?"ar":"en"}">${en?"عربي":"English"}</button></div>
    <div class="lgmark"><b>AML 360</b><span>${L2("الفحص الشامل لنظام AML","Complete AML system check")}</span></div>
    <h2>${has?L2("تسجيل الدخول","Sign in"):L2("إنشاء كلمة مرور الدخول","Create a sign-in password")}</h2>
    <p class="lead">${sbm?L2("أدخل البريد الإلكتروني وكلمة المرور.","Enter your email and password."):has?L2("أدخل كلمة المرور للمتابعة.","Enter the password to continue."):L2("أول استخدام على هذا المتصفح: أنشئ كلمة مرور (4 أحرف على الأقل).","First use on this browser: create a password (at least 4 characters).")}</p>
    ${sbm?`<input type="email" id="lgE" class="sq" dir="ltr" placeholder="${L2("البريد الإلكتروني","Email")}" autocomplete="username" value="${esc(SB_SES?.email||"")}">`:""}
    <input type="password" id="lg1" class="sq" placeholder="${L2("كلمة المرور","Password")}" autocomplete="current-password">
    ${has?"":`<input type="password" id="lg2" class="sq" placeholder="${L2("تأكيد كلمة المرور","Confirm password")}" autocomplete="new-password">`}
    <button class="primary" id="lgGo">${has?L2("دخول","Sign in"):L2("إنشاء ودخول","Create and sign in")}</button>
    <p class="msg err" id="lgMsg">${esc(msg||"")}</p>
    <div class="lgsb">${sbm?`<span class="sbdot"></span>${L2("متصل بقاعدة بيانات Supabase","Connected to Supabase")} · <span dir="ltr">${esc(host)}</span>${conf.fixed?"":` · <a id="sbEdit">${L2("تغيير","Change")}</a>`}`:`<a id="sbEdit">${L2("ربط بقاعدة بيانات Supabase","Connect a Supabase database")}</a>`}</div>
    <div id="sbBox"></div>
    ${sbm?"":`<div class="lgft">${L2("كلمة المرور محفوظة في هذا المتصفح فقط","Password is stored in this browser only")}</div>`}</div>`;
  const m = $("#lgMsg");
  const go = async ()=>{ const a = $("#lg1").value; m.textContent = "";
    if (sbm){ const e = $("#lgE").value.trim(); if (!e || !a){ m.textContent = L2("أدخل البريد وكلمة المرور","Enter email and password"); return; }
      $("#lgGo").disabled = true; m.className = "msg"; m.textContent = L2("جارٍ الدخول…","Signing in…");
      try{ await sbLogin(e, a); await sbLoadAll(); m.textContent = ""; enter(); }
      catch(er){ m.className = "msg err"; m.textContent = /invalid/i.test(er.message) ? L2("البريد أو كلمة المرور غير صحيحة","Wrong email or password") : /fetch|network|load failed/i.test(er.message) ? L2(`تعذّر الاتصال بـ ${sbBase()} — تحقق من الرابط والشبكة`,`Could not reach ${sbBase()} — check the URL and network`) : er.message; $("#lgGo").disabled = false; }
      return; }
    const st = loginGet();
    if (st){ if (await pwdHash("login::"+a)===st){ enter(); } else { m.textContent = L2("كلمة المرور غير صحيحة","Wrong password"); $("#lg1").value = ""; $("#lg1").focus(); } return; }
    const b = $("#lg2").value; if (a.length<4){ m.textContent = L2("4 أحرف على الأقل","At least 4 characters"); return; } if (a!==b){ m.textContent = L2("كلمتا المرور غير متطابقتين","Passwords do not match"); return; }
    try{ localStorage.setItem(LOGIN_KEY, await pwdHash("login::"+a)); }catch(e){} enter(); };
  $("#lgGo").onclick = go; el.querySelectorAll("input").forEach(i=>i.onkeydown = e=>{ if (e.key==="Enter") go(); });
  el.querySelector("[data-lg]").onclick = e=>{ LANG = e.currentTarget.dataset.lg; try{ localStorage.setItem("amlsa.lang", LANG); }catch(_){} applyPrefs(); showLogin(); };
  const ed = $("#sbEdit"); if (ed) ed.onclick = ()=>{ const c = sbConf()||{url:"",key:""};
    $("#sbBox").innerHTML = `<div class="sbform"><input class="sq" id="sbU" dir="ltr" placeholder="Project URL · https://xxxx.supabase.co" value="${esc(c.url)}"><input class="sq" id="sbK" dir="ltr" placeholder="anon public key" value="${esc(c.key)}">
      <div class="row" style="gap:6px;flex-wrap:wrap"><button class="primary" id="sbSave">${L2("حفظ الاتصال","Save connection")}</button>${SB_ON()?`<button id="sbOff">${L2("فصل والعمل محلياً","Disconnect, work locally")}</button>`:""}</div></div>`;
    $("#sbSave").onclick = ()=>{ const u = sbNormUrl($("#sbU").value), k = $("#sbK").value.trim().replace(/\s+/g,""); if (!/^https:\/\/.+/.test(u) || k.length<20){ m.textContent = L2("أدخل رابط المشروع ومفتاح anon","Enter the project URL and anon key"); return; }
      try{ localStorage.setItem(SBC_KEY, JSON.stringify({url:u, key:k})); }catch(e){} sbSaveSes(null); showLogin(); };
    const off = $("#sbOff"); if (off) off.onclick = ()=>{ try{ localStorage.removeItem(SBC_KEY); }catch(e){} sbSaveSes(null); SB_HIST = []; SB_SET = {cfg:null,pwd:null}; CFG_CACHE = null; showLogin(); }; };
  (sbm ? ($("#lgE").value ? $("#lg1") : $("#lgE")) : $("#lg1")).focus();
}
function enter(){ setAuth(true); const el = document.getElementById("login"); if (el) el.hidden = true; document.getElementById("app").hidden = false; current = "home"; render(); window.scrollTo({top:0}); }
async function logout(){ if (SB_ON() && SB_SES?.at){ try{ await fetch(`${sbBase()}/auth/v1/logout`, {method:"POST", headers:{apikey:sbConf().key, Authorization:`Bearer ${SB_SES.at}`}}); }catch(e){} sbSaveSes(null); SB_HIST = []; SB_SET = {cfg:null,pwd:null}; CFG_CACHE = null; }
  setAuth(false); cfgUnlocked = false; showLogin(); }
(async function boot(){
  applyPrefs();
  try{ const s = JSON.parse(localStorage.getItem("amlsa.data")||"null"); if (s && s.DATA && Object.keys(s.DATA).length){ DATA = s.DATA; META = s.META; } }catch(e){}
  if (SB_ON() && SB_SES?.at){ try{ await sbLoadAll(); render(); return; }catch(e){ sbSaveSes(null); render(); showLogin(LANG==="en"?"Session expired — sign in again":"انتهت الجلسة — ادخل مرة أخرى"); return; } }
  if (authed()) render(); else { render(); showLogin(); }
})();
</script>
